<figure class="oe-canvas"><svg class="oe-wide" viewBox="0 0 1860 1180" role="img" aria-labelledby="oe-wide-title oe-wide-desc" xmlns="http://www.w3.org/2000/svg"><title id="oe-wide-title">Offline empowerment, from logged data to online exploration</title><desc id="oe-wide-desc">Offline: from unlabeled OGBench transitions (s, a, s′) with no reward and no skill labels, the method learns a skill-conditioned policy and where each skill leads, V^z(s+ | s). Empowerment Ê(s) = I(s+; z | s) is high at a junction, where skills reach different futures, and low in a dead end, where all futures overlap. The map read from the paper (Fig. 1b, antmaze-medium) peaks near 1.4 nats at the corridor junctions and falls to about 0.6 in the corners. Online: the frozen estimator scores each state of an episode. A bonus network B(s, a) learns the episode maximum of Ê. The actor maximizes Q(s, a, g) + β·B(s, a); the critic is contrastive RL (CRL), each batch is half online and half offline data (RLPD), and β falls to zero by mid-training. Result on antmaze-medium with navigate data (Fig. 4, 5 seeds): final success rises from 0.29 to 0.43 for CRL, from 0.29 to 0.50 for CRL + RND, from 0.81 to 0.95 for SUPE. Across all nine task and dataset pairs, adding Ê helps CRL on five and is on par on four.</desc><rect width="1860" height="1180" fill="#1d1d1b"/><g transform="translate(40 80)"><rect x="0" y="0" width="560" height="460" fill="#222a2f"/><path d="M0.1,0.1 Q280.5,0.4 561.7,0.2 Q558,230.1 560.5,459.8 Q279.9,461.6 -0.4,460.8 Q0.9,228.4 -1.5,-1.1 M-0.5,-0.6 Q280.4,-1.8 560.5,0.4 Q559.6,231.7 561.5,461.3 Q279.1,460.6 -1.2,457.9 Q1.2,232.3 -1,-1.7" fill="none" stroke="#d6d7d2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="-21" width="273" height="42" fill="#1d1d1b"/><path d="M17.2,-21.7 Q152.8,-20.6 290.7,-22.7 Q290.7,1.5 288.4,18.7 Q150.5,22.6 16,21.1 Q14.9,0 17.1,-23 M16.7,-23.2 Q152.2,-20.4 291.3,-21.3 Q288.8,-0.7 286.8,22.1 Q152.1,22.2 15,21.3 Q15.3,1.6 14 ,633.2 463.5,651.1 Q251.6,654.1 39.5,652.5 Q38.3,631.6 40.2,608.8 M41.8,607.8 Q252.7,608 461.6,611.9 Q459.7,631.8 460.1,651 Q253.4,652.1 38.5,649.6 Q38.4,631.7 40.6,611.6" fill="none" stroke="#d6d7d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="640" font-family="'Bradley Hand','Segoe Print','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="28" fill="#d6d7d2" font-weight="700">online · sparse-reward goals</text><path d="M1540,546 C1520,555 1510,590 1420,600 C1330,610 1133.3,602.7 1000,606 C866.7,609.3 703.3,606.3 620,620 C536.7,633.7 520,676.7 500,688" fill="none" stroke="#f0d98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M500,688 L513,687.1 M500,688 L507.4,677.3" fill="none" stroke="#f0d98a" stroke-width="3" stroke-linecap="round"/><text x="1040" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#f0d98a" text-anchor="end"><tspan>Ê</tspan></text><text x="1052" y="580" font-family="'Bradley Hand','Segoe Print','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="28" fill="#f0d98a" font-weight="700">frozen</text><path d="M1156,570 L1180,570 M1162,559.6 L1174,580.4 M1174,559.6 L1162,580.4" stroke="#f0d98a" stroke-width="2.4" stroke-linecap="round"/></svg><svg class="oe-tall" viewBox="0 0 640 3310" role="img" aria-labelledby="oe-tall-title oe-tall-desc" xmlns="http://www.w3.org/2000/svg"><title id="oe-tall-title">Offline empowerment, from logged data to online exploration</title><desc id="oe-tall-desc">Offline: from unlabeled OGBench transitions (s, a, s′) with no reward and no skill labels, the method learns a skill-conditioned policy and where each skill leads, V^z(s+ | s). Empowerment Ê(s) = I(s+; z | s) is high at a junction, where skills reach different futures, and low in a dead end, where all futures overlap. The map read from the paper (Fig. 1b, antmaze-medium) peaks near 1.4 nats at the corridor junctions and falls to about 0.6 in the corners. Online: the frozen estimator scores each state of an episode. A bonus network B(s, a) learns the episode maximum of Ê. The actor maximizes Q(s, a, g) + β·B(s, a); the critic is contrastive RL (CRL), each batch is half online and half offline data (RLPD), and β falls to zero by mid-training. Result on antmaze-medium with navigate data (Fig. 4, 5 seeds): final success rises from 0.29 to 0.43 for CRL, from 0.29 to 0.50 for CRL + RND, from 0.81 to 0.95 for SUPE. Across all nine task and dataset pairs, adding Ê helps CRL on five and is on par on four.</desc><rect width="640" height="3310" fill="#1d1d1b"/><g transform="translate(40 80)"><rect x="0" y="0" width="560" height="460" fill="#222a2f"/><path d="M0.1,0.1 Q280.5,0.4 561.7,0.2 Q558,230.1 560.5,459.8 Q279.9,461.6 -0.4,460.8 Q0.9,228.4 -1.5,-1.1 M-0.5,-0.6 Q280.4,-1.8 560.5,0.4 Q559.6,231.7 561.5,461.3 Q279.1,460.6 -1.2,457.9 Q1.2,232.3 -1,-1.7" fill="none" stroke="#d6d7d2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="-21" width="273" height="42" fill="#1d1d1b"/><path d="M17.2,-21.7 Q152.8,-20.6 290.7,-22.7 Q290.7,1.5 288.4,18.7 Q150.5,22.6 16,21.1 Q14.9,0 17.1,-23 M16.7,-23.2 Q152.2,-20.4 291.3,-21.3 Q288.8,-0.7 286.8,22.1 Q152.1,22.2 15,21.3 Q15.3,1.6 14.4,-22.8" fill="none" stroke="#d6d7d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="9" font-family="'Bradley Hand','Segoe Print','Chalkboard SE','Comic Neue','Comic Sans MS',cursive" font-size="27" fill="#d6d7d2" font-weight="700">1 · unlabeled data</text><rect x="180" y="58" width="52" height="52" fill="#3d3f38"/><path d="M197.3,60 L182,75.3 M230,75.3 L197.3,108 M214.7,60 L182,92.7 M230,92.7 L214.7,108 M232,60 L182,110" stroke="#72746d" stroke-width="1.4" stroke-linecap="round" opacity=".7"/><rect x="76" y="110" width="52" height="52" fill="#3d3f38"/><path d="M93.3,112 L78,127.3 M126,127.3 L93.3,160 M110.7,112 L78,144.7 M126,144.7 L110.7,160 M128,112 L78,162" stroke="#72
