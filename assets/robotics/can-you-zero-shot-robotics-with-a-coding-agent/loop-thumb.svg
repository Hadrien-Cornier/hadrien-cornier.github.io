<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 460 372" role="img" aria-labelledby="fig-aspire-t fig-aspire-d" xmlns="http://www.w3.org/2000/svg"><title id="fig-aspire-t">The ASPIRE loop: write, execute, trace, repair, verify, remember</title><desc id="fig-aspire-d">A task enters the actor, a coding agent that writes a robot program. The program goes to the execution engine, which records a trace of every perception, grasp and planning call. The trace returns to the actor, which diagnoses, repairs and re-runs. The actor turns a validated fix into a proposed skill. A fresh verifier agent must reproduce the fix from the proposal alone, and only then does the skill enter the skill library. The library feeds the actor on later tasks. Evolutionary search lets the actor try several programs per round, seeded by the best programs and their traces.</desc><defs><marker id="fig-aspire-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#242622"/></marker><marker id="fig-aspire-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#b44c2c"/></marker></defs><rect x="0.75" y="0.75" width="458.5" height="370.5" fill="#f1f2ed" stroke="#cfd1c8" stroke-width="1.5"/><g font-family="Arial, Helvetica, sans-serif" fill="#242622"><g stroke-width="1.5"><rect x="8" y="40" width="130" height="64" fill="#f6e4dc" stroke="#b44c2c"/><rect x="165" y="40" width="130" height="64" fill="#fff" stroke="#242622"/><rect x="322" y="40" width="130" height="64" fill="#fff" stroke="#242622"/><rect x="8" y="140" width="130" height="64" fill="#fff" stroke="#242622"/><rect x="165" y="140" width="130" height="64" fill="#d7e5ee" stroke="#2b6a8e"/><rect x="8" y="240" width="130" height="64" fill="#f6e4dc" stroke="#b44c2c"/><rect x="165" y="240" width="130" height="64" fill="#d7e5ee" stroke="#2b6a8e"/></g><g fill="none" stroke="#242622" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M230,10 V38" marker-end="url(#fig-aspire-a)"/><path d="M140,72 H163" stroke="#b44c2c" marker-end="url(#fig-aspire-r)"/><path d="M297,72 H320" marker-start="url(#fig-aspire-a)" marker-end="url(#fig-aspire-a)"/><path d="M200,104 V138" marker-end="url(#fig-aspire-a)"/><path d="M230,204 V238" marker-end="url(#fig-aspire-a)"/><path d="M297,272 H310 V122 H270 V106" marker-end="url(#fig-aspire-a)"/><path d="M165,96 H150 V272 H140" marker-end="url(#fig-aspire-a)"/><path d="M73,238 V206" marker-end="url(#fig-aspire-a)"/><path d="M73,138 V106" stroke="#b44c2c" marker-end="url(#fig-aspire-r)"/></g><g text-anchor="middle" font-size="13" font-weight="700"><text x="73" y="60">Skill library</text><text x="230" y="60">Actor</text><text x="387" y="60" font-size="12.5">Evolutionary search</text><text x="73" y="160">Verifier</text><text x="230" y="160">Execution engine</text><text x="73" y="260">Proposed skill</text><text x="230" y="260">Trace per call</text></g><g text-anchor="middle" font-size="11.5" fill="#4a4d47"><text x="73" y="77">one text note</text><text x="73" y="92">per verified fix</text><text x="230" y="77">coding agent writes</text><text x="230" y="92">a Python program</text><text x="387" y="77">K programs a round,</text><text x="387" y="92">from top 3 + traces</text><text x="73" y="177">fresh agent, proposal</text><text x="73" y="192">only, 5 seeds</text><text x="230" y="177">runs perception, grasp</text><text x="230" y="192">and motion planning</text><text x="73" y="277">from a validated fix:</text><text x="73" y="292">signature, when, repair</text><text x="230" y="277">inputs, outputs, status,</text><text x="230" y="292">RGB before and after</text></g><g font-size="11.5" fill="#656b62"><text x="240" y="24">task + debug seeds</text><text x="208" y="126">program</text><text x="238" y="225">records</text><text x="318" y="180">diagnose,</text><text x="318" y="195">repair,</text><text x="318" y="210">re-run</text><text x="82" y="226" fill="#b44c2c">verify</text><text x="82" y="126" fill="#b44c2c">promote</text></g><g text-anchor="middle" font-size="12" fill="#656b62"><text x="230" y="336">Debug seeds drive the loop. Held-out seeds run once, at the end.</text><text x="230" y="354">Red: what persists between tasks. Blue: the environment.</text></g></g></svg>
