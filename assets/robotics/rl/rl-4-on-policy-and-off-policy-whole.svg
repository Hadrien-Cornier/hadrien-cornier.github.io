<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 -57 680 400" width="720" height="424" role="img" aria-label="Two blackboard panels: the behavior policy picks the move and the target follows the target policy's next move, and one row of next values gives three targets: Q-learning's max gives 8 (off-policy), Sarsa's sample gives 8 or -10, and Expected Sarsa's average gives 6.2 (both on-policy)" color="#f4f1e8"><style>.rls-panel-title{font-family:'Patrick Hand','Chalkboard SE','Comic Neue','Segoe Print',cursive;font-size:16px;font-weight:700;fill:#f4f1e8}</style><rect x="0" y="-57" width="680" height="400" fill="#1d2824"/><defs><clipPath id="thumb-row1"><rect x="0" y="0" width="680" height="288"/></clipPath></defs><g clip-path="url(#thumb-row1)"><g class="rc-panel" data-panel="policies"><rect x="12" y="12" width="324" height="266" rx="4" fill="#1d2824" stroke="#6f7d75"/><text class="rls-panel-title" x="24" y="36">1. Two policies, one task</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" aria-hidden="true"><title>The behavior policy b picks the move from s to s′. From s′ there are two futures: b's next move and the target policy π's next move. The target follows π, and its value is credited back to (s, a). On-policy means π equals b; off-policy means they differ.</title><defs><marker id="canvas-4-0-p4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="&apos;Patrick Hand&apos;,&apos;Chalkboard SE&apos;,&apos;Comic Neue&apos;,&apos;Segoe Print&apos;,cursive" font-size="18" fill="#f4f1e8"><circle cx="34" cy="56" r="21" fill="#93d4ff" fill-opacity="0.16" stroke="#f4f1e8"/><text x="34" y="62" text-anchor="middle">s</text><path d="M57 56H104" stroke="#93d4ff" stroke-width="2" marker-end="url(#canvas-4-0-p4a)"/><text x="80" y="38" text-anchor="middle" font-size="15" fill="#93d4ff">b picks a</text><circle cx="130" cy="56" r="21" fill="#93d4ff" fill-opacity="0.16" stroke="#f4f1e8"/><text x="130" y="62" text-anchor="middle">s′</text><path d="M151 46Q184 26 220 24" fill="none" stroke="#93d4ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#canvas-4-0-p4a)"/><text x="226" y="29" font-size="15" fill="#93d4ff">b next</text><path d="M151 66Q184 88 216 90" fill="none" stroke="#f4f1e8" stroke-width="2" marker-end="url(#canvas-4-0-p4a)"/><text x="226" y="95" font-size="15">π next</text><ellipse cx="249" cy="90" rx="31" ry="16" fill="none" stroke="#ffe17c" stroke-width="2"/><text x="208" y="62" text-anchor="middle" font-size="14" fill="#ffe17c">target follows π</text><path d="M248 108Q150 196 40 80" fill="none" stroke="#f4f1e8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#canvas-4-0-p4a)"/><text x="150" y="172" text-anchor="middle" font-size="14" fill="#c3c9bd">value credited to (s, a)</text><text x="148" y="194" text-anchor="end" font-size="16">on-policy:</text><text x="156" y="194" font-size="16">π = b</text><text x="148" y="213" text-anchor="end" font-size="16">off-policy:</text><text x="156" y="213" font-size="16">π ≠ b</text></g></svg></g><g class="rc-panel" data-panel="targets"><rect x="352" y="12" width="324" height="266" rx="4" fill="#1d2824" stroke="#6f7d75"/><text class="rls-panel-title" x="364" y="36">2. One row, three targets</text><svg x="364" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" aria-hidden="true"><title>The same action row feeds three targets. Q-learning takes the maximum, 10, for a target of 8 (off-policy). Sarsa takes one sampled next value, 10 or −10, for a target of 8 or −10 (on-policy). Expected Sarsa with π = b takes the average, 8, for a target of 6.2 (on-policy).</title><defs><marker id="canvas-4-1-p4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="&apos;Patrick Hand&apos;,&apos;Chalkboard SE&apos;,&apos;Comic Neue&apos;,&apos;Segoe Print&apos;,cursive" font-size="18" fill="#f4f1e8"><rect x="25" y="12" width="250" height="54" fill="#93d4ff" fill-opacity="0.16" stroke="#f4f1e8"/><path d="M150 12V66" stroke="#f4f1e8"/><text x="86" y="35" text-anchor="middle">right: 10</text><text x="213" y="35" text-anchor="middle">down: −10</text><text x="86" y="57" text-anchor="middle">b = 0.9</text><text x="213" y="57" text-anchor="middle">b = 0.1</text><path d="M80 69L49 99" fill="none" stroke="#f4f1e8" stroke-width="2" marker-end="url(#canvas-4-1-p4b)"/><path d="M150 69V99" fill="none" stroke="#f4f1e8" stroke-width="2" marker-end="url(#canvas-4-1-p4b)"/><path d="M220 69L249 99" fill="none" stroke="#f4f1e8" stroke-width="2" marker-end="url(#canvas-4-1-p4b)"/><text x="45" y="121" text-anchor="middle">max</text><text x="150" y="121" text-anchor="middle">sample</text><text x="252" y="121" text-anchor="middle">average</text><text x="45" y="142" text-anchor="middle">10 → 8</text><text x="150" y="142" text-anchor="middle">10 → 8</text><text x="150" y="160" text-anchor="middle" font-size="15">or −10 → −10</text><text x="252" y="142" text-anchor="middle">8 → 6.2</text><text x="45" y="181" text-anchor="middle" font-size="15" fill="#93d4ff">Q-learning</text><text x="150" y="181" text-anchor="middle" font-size="15" fill="#93d4ff">Sarsa</text><text x="252" y="181" text-anchor="middle" font-size="15" fill="#93d4ff">Expected Sarsa</text><text x="45" y="197" text-anchor="middle" font-size="13">off-policy</text><text x="150" y="197" text-anchor="middle" font-size="13">on-policy</text><text x="252" y="197" text-anchor="middle" font-size="13">on-policy, π = b</text><text x="150" y="215" text-anchor="middle" font-size="13" fill="#c3c9bd">next value → target (r = −1, γ = 0.9)</text></g></svg></g></g></svg>