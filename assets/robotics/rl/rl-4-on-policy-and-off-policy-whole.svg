<svg preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 0 680 864" role="img" aria-label="Whole mechanism map: On-policy and off-policy: whose future are we learning?"><style>.rls-panel-title{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#50554e}</style><g class="rc-panel" data-panel="policies"><rect x="12" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="36">1. Two policies, one task</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Behavior produces a transition; target policy specifies the continuation used to value it"><defs><marker id="canvas-4-0-p4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="40" cy="65" r="23" fill="#d7e5ee" stroke="#242622"/><text x="40" y="71" text-anchor="middle">s</text><path d="M65 65H171" stroke="#2b6a8e" stroke-width="2" marker-end="url(#canvas-4-0-p4a)"/><text x="110" y="43" text-anchor="middle">b picks a</text><circle cx="200" cy="65" r="23" fill="#d7e5ee" stroke="#242622"/><text x="200" y="71" text-anchor="middle">s′</text><path d="M216 85Q256 115 265 148" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-4-0-p4a)"/><text x="158" y="119">π values</text><text x="158" y="140">the future</text><path d="M246 168H61Q40 168 40 94" fill="none" stroke="#2b6a8e" stroke-width="2" marker-end="url(#canvas-4-0-p4a)"/><text x="145" y="195" text-anchor="middle">credit returns to (s, a)</text></g></svg></g><g class="rc-panel" data-panel="targets"><rect x="352" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="36">2. One row, three targets</text><svg x="364" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="The same action row feeds a maximum, one sample, or a weighted average"><defs><marker id="canvas-4-1-p4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><rect x="25" y="12" width="250" height="54" fill="#d7e5ee" stroke="#242622"/><path d="M150 12V66" stroke="#242622"/><text x="86" y="35" text-anchor="middle">right: 10</text><text x="213" y="35" text-anchor="middle">down: −10</text><text x="86" y="57" text-anchor="middle">b = 0.9</text><text x="213" y="57" text-anchor="middle">b = 0.1</text><path d="M80 69L44 112M150 69V112M220 69L255 112" fill="none" stroke="#242622" stroke-width="2" marker-end="url(#canvas-4-1-p4b)"/><text x="45" y="140" text-anchor="middle">max</text><text x="150" y="140" text-anchor="middle">sample</text><text x="252" y="140" text-anchor="middle">average</text><text x="45" y="169" text-anchor="middle">10</text><text x="150" y="169" text-anchor="middle">−10*</text><text x="252" y="169" text-anchor="middle">8</text><text x="150" y="205" text-anchor="middle">*a sampled down action</text></g></svg></g><g class="rc-panel" data-panel="cliff"><rect x="12" y="292" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="316">3. Exploration has a cost</text><svg x="24" y="326" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="A short edge route exposes exploratory downward actions to a cliff; an upper detour leaves a recovery cell"><defs><marker id="canvas-4-2-p4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><path d="M24 40H276V166H24Z M24 82H276 M24 124H276 M66 40V166 M108 40V166 M150 40V166 M192 40V166 M234 40V166" fill="none" stroke="#777"/><path d="M66 124H234V166H66Z" fill="#b44c2c" opacity=".25"/><text x="150" y="151" text-anchor="middle">cliff</text><text x="45" y="151" text-anchor="middle">S</text><text x="255" y="151" text-anchor="middle">G</text><path d="M45 130V103H255V127" fill="none" stroke="#b44c2c" stroke-width="3" marker-end="url(#canvas-4-2-p4c)"/><path d="M45 126V61H255V126" fill="none" stroke="#2b6a8e" stroke-width="3" marker-end="url(#canvas-4-2-p4c)"/><path d="M150 99V134" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-4-2-p4c)"/><path d="M109 58V93" stroke="#2b6a8e" stroke-width="2" marker-end="url(#canvas-4-2-p4c)"/><text x="150" y="25" text-anchor="middle">downward exploration</text><text x="150" y="201" text-anchor="middle">detour leaves recovery room</text></g></svg></g><g class="rc-panel" data-panel="coverage"><rect x="352" y="292" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="316">4. Data must cover the question</text><svg x="364" y="326" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Data cover one branch but omit a target-policy bridge and all states reached through it"><defs><marker id="canvas-4-3-p4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="52" cy="108" r="24" fill="#d7e5ee" stroke="#242622"/><text x="52" y="115" text-anchor="middle">s</text><path d="M72 94L177 48" stroke="#2b6a8e" stroke-width="3" marker-end="url(#canvas-4-3-p4d)"/><path d="M73 123L177 172" stroke="#b44c2c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#canvas-4-3-p4d)"/><circle cx="212" cy="40" r="25" fill="#d7e5ee" stroke="#242622"/><circle cx="212" cy="180" r="25" fill="#fff" stroke="#b44c2c"/><text x="212" y="46" text-anchor="middle">seen</text><text x="212" y="186" text-anchor="middle">?</text><text x="128" y="25" text-anchor="middle">b takes this</text><text x="155" y="126" text-anchor="middle">π needs bridge</text><path d="M125 141L145 164M145 141L125 164" stroke="#b44c2c" stroke-width="3"/><text x="126" y="210" text-anchor="middle">zero data for this branch</text></g></svg></g><g class="rc-panel" data-panel="weighting"><rect x="12" y="572" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="596">5. Correcting action probabilities</text><svg x="24" y="606" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Equal behavior action probabilities become target weights point eight and point two after multiplying by ratios"><defs><marker id="canvas-4-4-p4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="150" y="25" text-anchor="middle">b samples each action: 0.5</text><path d="M150 38L75 77M150 38L225 77" fill="none" stroke="#242622" stroke-width="2" marker-end="url(#canvas-4-4-p4e)"/><text x="75" y="103" text-anchor="middle">right</text><text x="225" y="103" text-anchor="middle">down</text><path d="M75 112V152M225 112V152" stroke="#2b6a8e" stroke-width="2" marker-end="url(#canvas-4-4-p4e)"/><text x="75" y="141" text-anchor="middle">× 1.6</text><text x="225" y="141" text-anchor="middle">× 0.4</text><text x="75" y="179" text-anchor="middle">weight 0.8</text><text x="225" y="179" text-anchor="middle">weight 0.2</text><text x="150" y="209" text-anchor="middle">target action proportions</text></g></svg></g><g class="rc-panel" data-panel="guarantees"><rect x="352" y="572" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="596">6. Which guarantees survive?</text><svg x="364" y="606" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="A shared parameter changes both the current prediction and the next-state prediction used as a target"><defs><marker id="canvas-4-5-p4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="150" cy="42" r="27" fill="#d7e5ee" stroke="#242622"/><text x="150" y="48" text-anchor="middle">w</text><path d="M132 64L71 105M168 64L229 105" fill="none" stroke="#242622" stroke-width="2" marker-end="url(#canvas-4-5-p4f)"/><text x="68" y="132" text-anchor="middle">value(s)</text><text x="232" y="132" text-anchor="middle">value(s′)</text><path d="M230 145Q150 204 75 148" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-4-5-p4f)"/><text x="150" y="187" text-anchor="middle">changes the target</text><path d="M43 113Q17 41 113 42" fill="none" stroke="#2b6a8e" stroke-width="2" marker-end="url(#canvas-4-5-p4f)"/><text x="150" y="216" text-anchor="middle">one update can move both</text></g></svg></g></svg>
