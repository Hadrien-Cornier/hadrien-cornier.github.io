<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 0 680 954" role="img" aria-label="Whole mechanism map: Function approximation: share a value, share an error"><style>.rls-panel-title{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#50554e}</style><g class="rc-panel" data-panel="scale"><rect x="12" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="36">1. The table grows</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-labelledby="canvas-3-0-f3-scale-title"><title id="canvas-3-0-f3-scale-title">Finer sensor bins create more unvisited table rows</title><defs><marker id="canvas-3-0-f3-scale-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#656b62"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">One sensor slice, two actions</text><g fill="#fff" stroke="#656b62"><path d="M20 48H110V136H20Z M65 48V136 M20 77H110 M20 106H110"/><path d="M190 48H280V136H190Z M235 48V136 M190 62H280 M190 77H280 M190 92H280 M190 106H280 M190 121H280"/></g><path d="M125 92H175" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-3-0-f3-scale-arr)"/><rect x="20" y="48" width="45" height="29" fill="#d7e5ee"/><rect x="190" y="48" width="45" height="14" fill="#d7e5ee"/><text x="16" y="168">Blue: one visited entry</text><text x="16" y="198">Four finer sensors → 16× rows</text></g></svg></g><g class="rc-panel" data-panel="linear"><rect x="352" y="12" width="324" height="296" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="36">2. One update shares learning</text><svg x="364" y="46" height="250" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 250" role="img" aria-labelledby="canvas-3-1-f3-linear-title"><title id="canvas-3-1-f3-linear-title">Training A changes predictions at A and unvisited B</title><defs><marker id="canvas-3-1-f3-linear-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b44c2c"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">Train A: features (1, 1), target 2</text><text x="16" y="58">Weights: (0, 0) → (0.2, 0.2)</text><path d="M150 75V98M150 98L65 128M150 98L238 128" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-3-1-f3-linear-arr)"/><circle cx="65" cy="153" r="30" fill="#d7e5ee" stroke="#242622"/><circle cx="238" cy="153" r="30" fill="#fff" stroke="#242622"/><text x="59" y="159">A</text><text x="232" y="159">B</text><text x="19" y="204">0 → 0.4</text><text x="195" y="204">0 → 0.6</text><text x="17" y="234">Visited</text><text x="177" y="234">Never visited</text></g></svg></g><g class="rc-panel" data-panel="alias"><rect x="12" y="322" width="324" height="286" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="346">3. Sharing can erase distinctions</text><svg x="24" y="356" height="240" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 240" role="img" aria-labelledby="canvas-3-2-f3-alias-title"><title id="canvas-3-2-f3-alias-title">Two true values collapse to one shared prediction</title><defs><marker id="canvas-3-2-f3-alias-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b44c2c"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="55" cy="46" r="27" fill="#d7e5ee" stroke="#242622"/><circle cx="245" cy="46" r="27" fill="#d7e5ee" stroke="#242622"/><text x="48" y="52">C</text><text x="238" y="52">D</text><text x="16" y="95">True value 0</text><text x="180" y="95">True value 2</text><path d="M55 108L128 143M245 108L172 143" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-3-2-f3-alias-arr)"/><text x="65" y="169">Same features (1, 0)</text><path d="M150 178V199" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-3-2-f3-alias-arr)"/><text x="43" y="226">One prediction: best fit 1</text></g></svg></g><g class="rc-panel" data-panel="semigradient"><rect x="352" y="322" width="324" height="296" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="346">4. Hold the target still</text><svg x="364" y="356" height="250" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 250" role="img" aria-labelledby="canvas-3-3-f3-sg-title"><title id="canvas-3-3-f3-sg-title">Semi-gradient TD differentiates the prediction but holds its target constant</title><defs><marker id="canvas-3-3-f3-sg-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#656b62"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">Same weights, two predictions</text><path d="M150 41L66 73M150 41L237 73" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-3-3-f3-sg-arr)"/><text x="16" y="101">Current value</text><text x="174" y="101">Next value</text><path d="M235 112V142H165" fill="none" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-3-3-f3-sg-arr)"/><text x="168" y="169" fill="#b44c2c">Target: hold</text><text x="168" y="192" fill="#b44c2c">constant</text><path d="M66 112V187H142" fill="none" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-3-3-f3-sg-arr)"/><text x="16" y="224">Differentiate current value only</text></g></svg></g><g class="rc-panel" data-panel="moving"><rect x="12" y="632" width="324" height="286" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="656">5. The target moves next time</text><svg x="24" y="666" height="240" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 240" role="img" aria-labelledby="canvas-3-4-f3-move-title"><title id="canvas-3-4-f3-move-title">A shared update raises both the current value and its next target</title><defs><marker id="canvas-3-4-f3-move-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b44c2c"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">Fit A once; shared weights rise</text><text x="16" y="64">A: 0.400 → 0.428</text><text x="16" y="100">B: 0.600 → 0.642</text><path d="M225 110V142H42" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-3-4-f3-move-arr)"/><text x="16" y="174">Next target for A = 0.9 × B</text><text x="16" y="210" fill="#b44c2c">0.5400 → 0.5778</text></g></svg></g><g class="rc-panel" data-panel="network"><rect x="352" y="632" width="324" height="296" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="656">6. Networks need steadier targets</text><svg x="364" y="666" height="250" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 250" role="img" aria-labelledby="canvas-3-5-f3-net-title"><title id="canvas-3-5-f3-net-title">Replay supplies transitions while a separate network supplies targets</title><defs><marker id="canvas-3-5-f3-net-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#656b62"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">Saved transitions → sample batch</text><path d="M62 42V66M235 42V66" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-3-5-f3-net-arr)"/><text x="16" y="93">Live network</text><text x="168" y="93">Target copy</text><text x="16" y="123" fill="#b44c2c">Weights move</text><text x="168" y="123">Held still</text><path d="M235 134V162H150" fill="none" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-3-5-f3-net-arr)"/><text x="114" y="188">Target</text><path d="M111 181H49V135" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-3-5-f3-net-arr)"/><path d="M47 204H250" stroke="#656b62" stroke-dasharray="5 4" stroke-width="2" marker-end="url(#canvas-3-5-f3-net-arr)"/><text x="16" y="237">Periodic copy → refresh target</text></g></svg></g></svg>
