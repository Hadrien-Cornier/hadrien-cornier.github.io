<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -38 680 400" width="720" height="424" role="img" aria-label="Function approximation: finer bins multiply table rows, and one update on A also moves never visited B from 0 to 0.6"><rect x="0" y="-38" width="680" height="400" fill="#1d2824"/><g class="rc-panel" data-panel="scale"><rect x="12" y="12" width="324" height="266" rx="4" fill="none" stroke="#6f7d75" stroke-dasharray="2 5"/><text font-family="'Chalkboard SE','Comic Sans MS',cursive" font-size="16" fill="#ffe17c" x="24" y="36">1. The table grows</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-labelledby="canvas-3-0-f3-scale-title"><title id="canvas-3-0-f3-scale-title">Finer sensor bins create more table rows, and every unvisited row knows nothing</title><defs><marker id="canvas-3-0-f3-scale-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#c3c9bd"/></marker></defs><g font-family="'Chalkboard SE','Comic Sans MS','Patrick Hand',cursive" font-size="18" fill="#f4f1e8"><text x="16" y="27">One sensor slice, two actions</text><rect x="20" y="46" width="45" height="34" fill="rgba(147,212,255,0.16)"/><rect x="190" y="46" width="45" height="17" fill="rgba(147,212,255,0.16)"/><g fill="none" stroke="#c3c9bd"><path d="M20 46H110V148H20Z M65 46V148 M20 80H110 M20 114H110"/><path d="M190 46H280V148H190Z M235 46V148 M190 63H280 M190 80H280 M190 97H280 M190 114H280 M190 131H280"/></g><text x="87.5" y="68" font-size="15" text-anchor="middle" fill="#c3c9bd">?</text><text x="42.5" y="102" font-size="15" text-anchor="middle" fill="#c3c9bd">?</text><text x="87.5" y="102" font-size="15" text-anchor="middle" fill="#c3c9bd">?</text><text x="42.5" y="136" font-size="15" text-anchor="middle" fill="#c3c9bd">?</text><text x="87.5" y="136" font-size="15" text-anchor="middle" fill="#c3c9bd">?</text><text x="257.5" y="59.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="212.5" y="76.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="257.5" y="76.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="212.5" y="93.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="257.5" y="93.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="212.5" y="110.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="257.5" y="110.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="212.5" y="127.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="257.5" y="127.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="212.5" y="144.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><text x="257.5" y="144.0" font-size="13" text-anchor="middle" fill="#c3c9bd">?</text><path d="M125 97H175" stroke="#c3c9bd" stroke-width="2" marker-end="url(#canvas-3-0-f3-scale-arr)"/><text x="150" y="86" font-size="14" text-anchor="middle" fill="#c3c9bd">2× bins</text><text x="16" y="178" font-size="16">Blue: visited. ?: knows nothing</text><text x="16" y="206" font-size="16">Four finer sensors → 16× rows</text></g></svg></g><g class="rc-panel" data-panel="linear"><rect x="352" y="12" width="324" height="296" rx="4" fill="none" stroke="#6f7d75" stroke-dasharray="2 5"/><text font-family="'Chalkboard SE','Comic Sans MS',cursive" font-size="16" fill="#ffe17c" x="364" y="36">2. One update shares learning</text><svg x="364" y="46" height="250" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 250" role="img" aria-labelledby="canvas-3-1-f3-linear-title"><title id="canvas-3-1-f3-linear-title">Training A changes predictions at A and unvisited B</title><defs><marker id="canvas-3-1-f3-linear-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#ff9f88"/></marker></defs><g font-family="'Chalkboard SE','Comic Sans MS','Patrick Hand',cursive" font-size="18" 