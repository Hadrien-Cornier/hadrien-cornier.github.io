<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -81 1260 742" width="720" height="424" role="img" aria-labelledby="problems-title problems-desc"><title id="problems-title">Six problems that shape reinforcement learning</title><desc id="problems-desc">Delayed credit, exploration, waiting for outcomes, sharing learning, reusing data and feedback between predictions and targets.</desc><rect x="-400" y="-400" width="2060" height="1542" fill="#1d2824"/><g fill="#f4f1e8" font-family="'Chalkboard SE','Comic Sans MS','Patrick Hand',cursive"><g data-panel="credit"><rect x="20" y="20" width="380" height="250" rx="5" fill="none" stroke="#6f7d75" stroke-width="2" stroke-dasharray="2 5"/><text x="40" y="62" font-size="25" font-weight="700">1. Delayed reward</text><text x="40" y="108" font-size="20">Which move earned the reward?</text><circle cx="65" cy="170" r="11" fill="none" stroke="#f4f1e8" stroke-width="2"/><path d="M78 170L105 170" stroke="#c3c9bd" stroke-width="2"/><path d="M100.0 174.2L107.0 170.0L100.0 165.8" fill="none" stroke="#c3c9bd" stroke-width="2.2"/><circle cx="120" cy="170" r="11" fill="none" stroke="#f4f1e8" stroke-width="2"/><path d="M133 170L160 170" stroke="#c3c9bd" stroke-width="2"/><path d="M155.0 174.2L162.0 170.0L155.0 165.8" fill="none" stroke="#c3c9bd" stroke-width="2.2"/><circle cx="175" cy="170" r="11" fill="none" stroke="#f4f1e8" stroke-width="2"/><path d="M188 170L215 170" stroke="#c3c9bd" stroke-width="2"/><path d="M210.0 174.2L217.0 170.0L210.0 165.8" fill="none" stroke="#c3c9bd" stroke-width="2.2"/><circle cx="230" cy="170" r="11" fill="none" stroke="#f4f1e8" stroke-width="2"/><path d="M246 170L282 170" stroke="#c3c9bd" stroke-width="2"/><path d="M277.0 174.2L284.0 170.0L277.0 165.8" fill="none" stroke="#c3c9bd" stroke-width="2.2"/><path d="M310 154l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" stroke="#a8e2a0" fill="rgba(168,226,160,.25)" stroke-width="2"/><text x="350" y="176" font-size="17" fill="#a8e2a0">win</text><path d="M312 152C270 126 110 126 68 155" fill="none" stroke="#ffe17c" stroke-width="2.4" stroke-dasharray="4 6"/><path d="M69.1 144.6L68.0 155.0L77.7 151.0" fill="none" stroke="#ffe17c" stroke-width="2.2"/><text x="190" y="130" text-anchor="middle" font-size="16" fill="#ffe17c">credit for which move?</text><text x="40" y="242" font-size="18">Credit must reach earlier choices.</text></g><g data-panel="bandit"><rect x="440" y="20" width="380" height="250" rx="5" fill="none" stroke="#6f7d75" stroke-width="2" stroke-dasharray="2 5"/><text x="460" y="62" font-size="25" font-weight="700">2. Exploration</text><text x="460" y="108" font-size="20">Which choice have we missed?</text><rect x="480" y="142" width="70" height="56" rx="6" fill="none" stroke="#f4f1e8" stroke-width="2"/><text x="515" y="166" text-anchor="middle" font-size="18" fill="#f4f1e8">A</text><text x="515" y="189" text-anchor="middle" font-size="18" fill="#ff9f88">+4</text><rect x="640" y="142" width="70" height="56" rx="6" fill="none" stroke="#c3c9bd" stroke-width="2" stroke-dasharray="5 5"/><text x="675" y="166" text-anchor="middle" font-size="18" fill="#c3c9bd">B</text><text x="675" y="189" text-anchor="middle" font-size="20" fill="#ffe17c">?</text><path d="M515 202C500 222 535 226 522 206" fill="none" stroke="#ff9f88" stroke-width="2.2"/><text x="558" y="218" font-size="15" fill="#ff9f88">again, again</text><text x="725" y="176" font-size="15" fill="#c3c9bd">never tried</text><text x="460" y="242" font-size="18">Other choices remain unknown.</text></g><g data-panel="horizons" transform="translate(840 -290)"><rect x="20" y="310" width="380" height="250" rx="5" fill="none" stroke="#6f7d75" stroke-width="2" stroke-dasharray="2 5"/><text x="40" y="352" font-size="25" font-weight="700">3. Waiting</text><text x="40" y="398" font-size="20">Can we learn before the end?</text><circle cx="80" cy="462" r="13" fill="none" stroke="#f4f1e8" stroke-width="2"/><text x="80" y="467" text-anchor="middle" font-size="15" fill="#f4f1e8">s</text><path d="M95 462Q150 444 202 462" fill="none" stroke="#f4f1e8" stroke-width="2"/><path d="M195.6 466.0L204.0 462.0L196.5 456.4" fill="none" stroke="#f4f1e8" stroke-width="2.2"/><text x="148" y="484" text-anchor="middle" font-size="15" fill="#f4f1e8">r now</text><circle cx="220" cy="462" r="13" fill="none" stroke="#f4f1e8" stroke-width="2"/><text x="220" y="467" text-anchor="middle" font-size="15" fill="#f4f1e8">s′</text><path d="M242 432c-6-16 12-24 22-14 6-12 28-8 28 6 14-2 18 16 6 22 4 14-16 18-24 10-10 10-30 4-28-8-12-2-12-16-4-16z" fill="none" stroke="#93d4ff" stroke-width="2"/><text x="272" y="448" text-anchor="middle" font-size="15" fill="#93d4ff">guess</text><text x="236" y="490" font-size="15" fill="#c3c9bd">(no ending yet)</text><text x="40" y="532" font-size="18">A guess can carry an error.</text></g><g data-panel="sharing" transform="translate(-420 0)"><rect x="440" y="310" width="380" height="250" rx="5" fill="none" stroke="#6f7d75" stroke-width="2" stroke-dasharray="2 5"/><text x="460" y="352" font-size="25" font-weight="700">4. Scale</text><text x="460" y="398" font-size="20">Can one lesson help elsewhere?</text><rect x="480" y="460" width="40" height="34" rx="4" fill="rgba(147,212,255,.14)" stroke="#f4f1e8" stroke-width="2"/><path d="M490 484l8-14 8 9 6-5" fill="none" stroke="#c3c9bd" stroke-width="1.6"/><path d="M500 458Q580.0 432 692 444" fill="none" stroke="#93d4ff" stroke-width="1.8"/><rect x="535" y="460" width="40" height="34" rx="4" fill="rgba(147,212,255,.14)" stroke="#f4f1e8" stroke-width="2"/><path d="M545 484l8-14 8 9 6-5" fill="none" stroke="#c3c9bd" stroke-width="1.6"/><path d="M555 458Q613.0 432 692 444" fill="none" stroke="#93d4ff" stroke-width="1.8"/><rect x="590" y="460" width="40" height="34" rx="4" fill="rgba(147,212,255,.14)" stroke="#f4f1e8" stroke-width="2"/><path d="M600 484l8-14 8 9 6-5" fill="none" stroke="#c3c9bd" stroke-width="1.6"/><path d="M610 458Q646.0 432 692 444" fill="none" stroke="#93d4ff" stroke-width="1.8"/><circle cx="712" cy="448" r="20" fill="none" stroke="#93d4ff" stroke-width="2.2"/><text x="712" y="454" text-anchor="middle" font-size="17" fill="#93d4ff">V</text><text x="712" y="506" text-anchor="middle" font-size="15" fill="#c3c9bd">one shared value</text><text x="460" y="532" font-size="18">Sharing can also spread a mistake.</text></g><g data-panel="behavior" transform="translate(420 -290)"><rect x="20" y="600" width="380" height="250" rx="5" fill="none" stroke="#6f7d75" stroke-width="2" stroke-dasharray="2 5"/><text x="40" y="642" font-size="25" font-weight="700">5. Reusing data</text><text x="40" y="688" font-size="20">Whose choices does the data show?</text><path d="M60 750C120 744 170 764 230 766S320 758 360 770" fill="none" stroke="#c3c9bd" stroke-width="2.2" stroke-dasharray="6 6"/><text x="270" y="792" font-size="15" fill="#c3c9bd">old behavior (data)</text><path d="M170 758C210 744 250 724 300 716" fill="none" stroke="#93d4ff" stroke-width="2.4"/><path d="M294.8 721.9L302.0 716.0L293.4 712.4" fill="none" stroke="#93d4ff" stroke-width="2.2"/><text x="220" y="716" font-size="15" fill="#93d4ff">new policy</text><text x="320" y="722" font-size="20" fill="#ffe17c">?</text><text x="40" y="822" font-size="18">Missing actions stay uncertain.</text></g><g data-panel="triad" transform="translate(420 -290)"><rect x="440" y="600" width="380" height="250" rx="5" fill="none" stroke="#6f7d75" stroke-width="2" stroke-dasharray="2 5"/><text x="460" y="642" font-size="25" font-weight="700">6. Feedback</text><text x="460" y="688" font-size="20">What if a guess changes its target?</text><text x="510" y="752" text-anchor="middle" font-size="16" fill="#f4f1e8">prediction</text><text x="750" y="752" text-anchor="middle" font-size="16" fill="#f4f1e8">target</text><path d="M550 732C590 700 670 700 708 732" fill="none" stroke="#ff9f88" stroke-width="2.4"/><path d="M699.8 731.5L710.0 734.0L707.5 723.8" fill="none" stroke="#ff9f88" stroke-width="2.2"/><path d="M710 764C670 794 590 794 552 764" fill="none" stroke="#ff9f88" stroke-width="2.4"/><path d="M560.2 764.5L550.0 762.0L552.5 772.2" fill="none" stroke="#ff9f88" stroke-width="2.2"/><text x="630" y="734" text-anchor="middle" font-size="14" fill="#c3c9bd">builds</text><text x="630" y="774" text-anchor="middle" font-size="14" fill="#c3c9bd">trains</text><text x="460" y="822" font-size="18">An error can feed itself.</text></g></g></svg>
