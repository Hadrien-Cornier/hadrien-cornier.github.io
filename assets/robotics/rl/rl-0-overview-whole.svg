<svg preserveAspectRatio="xMidYMid meet" class="rc-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 870" role="img" aria-labelledby="problems-title problems-desc"><style>.rls-panel-title{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#50554e}</style><title id="problems-title">Six problems that shape reinforcement learning</title><desc id="problems-desc">Delayed credit, exploration, waiting for outcomes, sharing learning, reusing data and feedback between predictions and targets.</desc><g fill="#242622" font-family="Arial,sans-serif"><g class="rc-panel" data-panel="credit"><rect x="20" y="20" width="380" height="250" rx="5" fill="#f5f4ed" stroke="#7f8f79" stroke-width="2"/><text x="40" y="62" font-size="25" font-weight="700">1. Delayed reward</text><text x="40" y="108" font-size="20">Which move earned the reward?</text><text x="40" y="170" font-size="18">move → move → move → win</text><text x="40" y="208" font-size="18">Credit must reach earlier choices.</text></g><g class="rc-panel" data-panel="bandit"><rect x="440" y="20" width="380" height="250" rx="5" fill="#f5f4ed" stroke="#7f8f79" stroke-width="2"/><text x="460" y="62" font-size="25" font-weight="700">2. Exploration</text><text x="460" y="108" font-size="20">Which choice have we missed?</text><text x="460" y="170" font-size="18">lucky first result → repeat it</text><text x="460" y="208" font-size="18">Other choices remain unknown.</text></g><g class="rc-panel" data-panel="horizons"><rect x="20" y="310" width="380" height="250" rx="5" fill="#f5f4ed" stroke="#7f8f79" stroke-width="2"/><text x="40" y="352" font-size="25" font-weight="700">3. Waiting</text><text x="40" y="398" font-size="20">Can we learn before the end?</text><text x="40" y="460" font-size="18">reward now + a guess about later</text><text x="40" y="498" font-size="18">A guess can carry an error.</text></g><g class="rc-panel" data-panel="sharing"><rect x="440" y="310" width="380" height="250" rx="5" fill="#f5f4ed" stroke="#7f8f79" stroke-width="2"/><text x="460" y="352" font-size="25" font-weight="700">4. Scale</text><text x="460" y="398" font-size="20">Can one lesson help elsewhere?</text><text x="460" y="460" font-size="18">similar situations → shared learning</text><text x="460" y="498" font-size="18">Sharing can also spread a mistake.</text></g><g class="rc-panel" data-panel="behavior"><rect x="20" y="600" width="380" height="250" rx="5" fill="#f5f4ed" stroke="#7f8f79" stroke-width="2"/><text x="40" y="642" font-size="25" font-weight="700">5. Reusing data</text><text x="40" y="688" font-size="20">Whose choices does the data show?</text><text x="40" y="750" font-size="18">old behavior → a new policy</text><text x="40" y="788" font-size="18">Missing actions stay uncertain.</text></g><g class="rc-panel" data-panel="triad"><rect x="440" y="600" width="380" height="250" rx="5" fill="#f5f4ed" stroke="#7f8f79" stroke-width="2"/><text x="460" y="642" font-size="25" font-weight="700">6. Feedback</text><text x="460" y="688" font-size="20">What if a guess changes its target?</text><text x="460" y="750" font-size="18">prediction → target → prediction</text><text x="460" y="788" font-size="18">An error can feed itself.</text></g></g></svg>
