<svg preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 0 680 954" role="img" aria-label="Whole mechanism map: Bootstrapping: learn before the reward arrives"><style>.rls-panel-title{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#50554e}</style><g class="rc-panel" data-panel="late"><rect x="12" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="36">1. A late reward</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-labelledby="canvas-2-0-b2-late-title"><title id="canvas-2-0-b2-late-title">Zero rewards before the final reward</title><defs><marker id="canvas-2-0-b2-late-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#656b62"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">Eight states, one final reward</text><path d="M32 74H266" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-2-0-b2-late-arr)"/><g fill="#d7e5ee" stroke="#242622"><rect x="15" y="52" width="28" height="42"/><rect x="46" y="52" width="28" height="42"/><rect x="77" y="52" width="28" height="42"/><rect x="108" y="52" width="28" height="42"/><rect x="139" y="52" width="28" height="42"/><rect x="170" y="52" width="28" height="42"/><rect x="201" y="52" width="28" height="42"/><rect x="232" y="52" width="28" height="42"/></g><text x="23" y="79">1</text><text x="54" y="79">2</text><text x="85" y="79">3</text><text x="116" y="79">4</text><text x="147" y="79">5</text><text x="178" y="79">6</text><text x="209" y="79">7</text><text x="240" y="79">8</text><text x="16" y="126">First seven moves: reward 0</text><text x="16" y="154" fill="#b44c2c">Last move → end: reward 1</text><path d="M246 168H32" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-2-0-b2-late-arr)"/><text x="16" y="202">Credit must reach earlier states</text></g></svg></g><g class="rc-panel" data-panel="mc"><rect x="352" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="36">2. Wait for the return</text><svg x="364" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-labelledby="canvas-2-1-b2-mc-title"><title id="canvas-2-1-b2-mc-title">Monte Carlo waits then updates earlier states</title><defs><marker id="canvas-2-1-b2-mc-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b44c2c"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="28">During walk: estimates wait</text><path d="M32 65H265" stroke="#656b62" stroke-width="2"/><circle cx="40" cy="65" r="20" fill="#fff" stroke="#242622"/><circle cx="135" cy="65" r="20" fill="#fff" stroke="#242622"/><circle cx="260" cy="65" r="20" fill="#e7c5b8" stroke="#242622"/><text x="35" y="71">0</text><text x="130" y="71">0</text><text x="251" y="71">+1</text><text x="16" y="110">Episode ends: return is known</text><path d="M260 93V145H42" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-2-1-b2-mc-arr)"/><text x="16" y="179">All eight targets = 1</text><text x="16" y="205">All eight estimates: 0 → 1</text></g></svg></g><g class="rc-panel" data-panel="td"><rect x="12" y="322" width="324" height="286" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="346">3. Borrow the next estimate</text><svg x="24" y="356" height="240" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 240" role="img" aria-labelledby="canvas-2-2-b2-td-title"><title id="canvas-2-2-b2-td-title">A next-state estimate supplies the TD target</title><defs><marker id="canvas-2-2-b2-td-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b44c2c"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="55" cy="61" r="32" fill="#d7e5ee" stroke="#242622"/><circle cx="244" cy="61" r="32" fill="#d7e5ee" stroke="#242622"/><text x="39" y="67">0.2</text><text x="228" y="67">0.8</text><path d="M91 61H207" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-2-2-b2-td-arr)"/><text x="109" y="45">reward 0</text><path d="M244 98V125H55V153" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-2-2-b2-td-arr)"/><text x="83" y="117">discount × 0.9</text><text x="16" y="180">Target: 0 + 0.9 × 0.8 = 0.72</text><text x="16" y="215">Halfway update: 0.2 → 0.46</text></g></svg></g><g class="rc-panel" data-panel="corridor"><rect x="352" y="322" width="324" height="296" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="346">4. Credit travels backward</text><svg x="364" y="356" height="250" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 250" role="img" aria-labelledby="canvas-2-3-b2-cor-title"><title id="canvas-2-3-b2-cor-title">One-step credit moves one state per forward walk</title><defs><marker id="canvas-2-3-b2-cor-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#b44c2c"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="27">State</text><text y="27"><tspan x="100">1</tspan><tspan x="123">2</tspan><tspan x="146">3</tspan><tspan x="169">4</tspan><tspan x="192">5</tspan><tspan x="215">6</tspan><tspan x="238">7</tspan><tspan x="261">8</tspan></text><text x="16" y="66">Walk 1</text><text y="66"><tspan x="100">0</tspan><tspan x="123">0</tspan><tspan x="146">0</tspan><tspan x="169">0</tspan><tspan x="192">0</tspan><tspan x="215">0</tspan><tspan x="238">0</tspan><tspan x="261" fill="#b44c2c">1</tspan></text><text x="16" y="105">Walk 2</text><text y="105"><tspan x="100">0</tspan><tspan x="123">0</tspan><tspan x="146">0</tspan><tspan x="169">0</tspan><tspan x="192">0</tspan><tspan x="215">0</tspan><tspan x="238" fill="#b44c2c">1</tspan><tspan x="261" fill="#b44c2c">1</tspan></text><text x="16" y="144">Walk 3</text><text y="144"><tspan x="100">0</tspan><tspan x="123">0</tspan><tspan x="146">0</tspan><tspan x="169">0</tspan><tspan x="192">0</tspan><tspan x="215" fill="#b44c2c">1</tspan><tspan x="238" fill="#b44c2c">1</tspan><tspan x="261" fill="#b44c2c">1</tspan></text><path d="M250 158L112 193" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-2-3-b2-cor-arr)"/><text x="16" y="224">Walk 8: all eight values are 1</text></g></svg></g><g class="rc-panel" data-panel="nstep"><rect x="12" y="632" width="324" height="276" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="656">5. Look several steps ahead</text><svg x="24" y="666" height="230" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 230" role="img" aria-labelledby="canvas-2-4-b2-n-title"><title id="canvas-2-4-b2-n-title">Three real rewards followed by one guessed tail</title><defs><marker id="canvas-2-4-b2-n-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#656b62"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="28">Three steps before the guess</text><path d="M28 70H270" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-2-4-b2-n-arr)"/><circle cx="28" cy="70" r="8" fill="#242622"/><circle cx="108" cy="70" r="8" fill="#242622"/><circle cx="188" cy="70" r="8" fill="#242622"/><circle cx="270" cy="70" r="8" fill="#b44c2c"/><text x="42" y="57">0</text><text x="122" y="57">0</text><text x="202" y="57">1</text><text x="16" y="113">Rewards: 0 + 0 + 1</text><text x="16" y="142">Then: discounted endpoint value</text><path d="M270 84V165H30" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-2-4-b2-n-arr)"/><text x="16" y="203">One target crosses three steps</text></g></svg></g><g class="rc-panel" data-panel="horizon"><rect x="352" y="632" width="324" height="276" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="656">6. Choose the horizon</text><svg x="364" y="666" height="230" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 230" role="img" aria-labelledby="canvas-2-5-b2-h-title"><title id="canvas-2-5-b2-h-title">Increasing the backup replaces guesses with observed rewards</title><defs><marker id="canvas-2-5-b2-h-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#656b62"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="16" y="25">Blue: observed · rust: guessed</text><rect x="20" y="48" width="35" height="25" fill="#d7e5ee"/><rect x="55" y="48" width="220" height="25" fill="#e7c5b8"/><text x="20" y="96">One step: short wait, long guess</text><rect x="20" y="117" width="180" height="25" fill="#d7e5ee"/><rect x="200" y="117" width="75" height="25" fill="#e7c5b8"/><text x="20" y="165">More steps: more observations</text><path d="M30 190H265" stroke="#656b62" stroke-width="2" marker-end="url(#canvas-2-5-b2-h-arr)"/><text x="22" y="218">Longer horizon → longer wait</text></g></svg></g></svg>
