<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 -57 680 400" width="720" height="424" role="img" aria-label="Two blackboard panels: six methods checked against shared weights, bootstrapping and off-policy data, with only DQN and SAC using all three, and the feedback loop that the three can close" color="#f4f1e8"><style>.rls-panel-title{font-family:'Patrick Hand','Chalkboard SE','Comic Neue','Segoe Print',cursive;font-size:16px;font-weight:700;fill:#f4f1e8}</style><rect x="0" y="-57" width="680" height="400" fill="#1d2824"/><defs><clipPath id="thumb-row1"><rect x="0" y="0" width="680" height="288"/></clipPath></defs><g clip-path="url(#thumb-row1)"><g class="rc-panel" data-panel="methods"><rect x="12" y="12" width="324" height="266" rx="4" fill="#1d2824" stroke="#6f7d75"/><text class="rls-panel-title" x="24" y="36">1. Who keeps all three?</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" aria-hidden="true"><title>Six methods against the three ingredients. All six use shared weights. DQN and SAC also bootstrap and learn off-policy, so they have all three. PPO bootstraps and trains on fresh data from its current policy, reused for a few epochs. GRPO and REINFORCE score whole answers or episodes on fresh data and learn no value from their own guesses. RECAP in pi*0.6 reuses old data but trains its value on complete returns.</title><g font-family="&apos;Patrick Hand&apos;,&apos;Chalkboard SE&apos;,&apos;Comic Neue&apos;,&apos;Segoe Print&apos;,cursive" font-size="15" fill="#f4f1e8"><text x="120" y="11" text-anchor="middle" font-size="13" fill="#c3c9bd">shared</text><text x="120" y="25" text-anchor="middle" font-size="13" fill="#c3c9bd">weights</text><text x="186" y="25" text-anchor="middle" font-size="13" fill="#c3c9bd">bootstrap</text><text x="259" y="25" text-anchor="middle" font-size="13" fill="#c3c9bd">off-policy</text><path d="M4 31H296" stroke="#c3c9bd" stroke-width="1.5"/><path d="M3 38Q150 35 297 38L297 83Q150 86 3 83Z" fill="none" stroke="#ffe17c" stroke-width="2"/><text x="8" y="52" font-size="15">DQN</text><path d="M113 47L118 52L128 40" fill="none" stroke="#ff9f88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 47L184 52L194 40" fill="none" stroke="#ff9f88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 47L257 52L267 40" fill="none" stroke="#ff9f88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="8" y="76" font-size="15">SAC</text><path d="M113 71L118 76L128 64" fill="none" stroke="#ff9f88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 71L184 76L194 64" fill="none" stroke="#ff9f88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 71L257 76L267 64" fill="none" stroke="#ff9f88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="8" y="100" font-size="15">PPO</text><path d="M113 95L118 100L128 88" fill="none" stroke="#f4f1e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 95L184 100L194 88" fill="none" stroke="#f4f1e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="259" y="100" text-anchor="middle" font-size="13" fill="#c3c9bd">fresh*</text><text x="8" y="124" font-size="15">GRPO</text><path d="M113 119L118 124L128 112" fill="none" stroke="#f4f1e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="124" text-anchor="middle" font-size="13" fill="#c3c9bd">returns</text><text x="259" y="124" text-anchor="middle" font-size="13" fill="#c3c9bd">fresh</text><text x="8" y="148" font-size="15">REINFORCE</text><path d="M113 143L118 148L128 136" fill="none" stroke="#f4f1e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="148" text-anchor="middle" font-size="13" fill="#c3c9bd">returns</text><text x="259" y="148" text-anchor="middle" font-size="13" fill="#c3c9bd">fresh</text><text x="8" y="172" font-size="14">RECAP (π*0.6)</text><path d="M113 167L118 172L128 160" fill="none" stroke="#f4f1e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="172" text-anchor="middle" font-size="13" fill="#c3c9bd">returns</text><path d="M252 167L257 172L267 160" fill="none" stroke="#f4f1e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="198" text-anchor="middle" font-size="13" fill="#c3c9bd">returns: no learned value trains on its own guess</text><text x="150" y="214" text-anchor="middle" font-size="13" fill="#c3c9bd">fresh: current policy's data; *reused a few epochs</text></g></svg></g><g class="rc-panel" data-panel="feedback"><rect x="352" y="12" width="324" height="266" rx="4" fill="#1d2824" stroke="#6f7d75"/><text class="rls-panel-title" x="364" y="36">2. Three pressures, one loop</text><svg x="364" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" aria-hidden="true"><title>The loop, clockwise: a shared-weight update also raises the next state's value, bootstrapping makes that value the next target, and the higher target raises the update again. The correcting update at the next state is never sampled with off-policy data.</title><defs><marker id="canvas-5-0-p5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="&apos;Patrick Hand&apos;,&apos;Chalkboard SE&apos;,&apos;Comic Neue&apos;,&apos;Segoe Print&apos;,cursive" font-size="18" fill="#f4f1e8"><text x="150" y="22" text-anchor="middle">shared update</text><path d="M171 31Q264 49 258 93" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="292" y="40" text-anchor="end" font-size="13" fill="#c3c9bd">shared</text><text x="292" y="55" text-anchor="end" font-size="13" fill="#c3c9bd">weights</text><text x="241" y="117" text-anchor="middle">next value</text><text x="241" y="140" text-anchor="middle">rises</text><path d="M227 150Q168 188 101 160" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="164" y="202" text-anchor="middle" font-size="13" fill="#c3c9bd">bootstrapping: it becomes the target</text><text x="66" y="139" text-anchor="middle">target</text><text x="66" y="162" text-anchor="middle">rises</text><path d="M43 115Q27 42 121 30" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="150" y="66" text-anchor="middle" font-size="13" fill="#93d4ff">correction at s′</text><path d="M151 74V116" stroke="#93d4ff" stroke-width="2" stroke-dasharray="5 4"/><path d="M139 84L163 106M163 84L139 106" stroke="#ff9f88" stroke-width="3"/><text x="150" y="134" text-anchor="middle" font-size="13" fill="#ff9f88">never sampled:</text><text x="150" y="149" text-anchor="middle" font-size="13" fill="#ff9f88">off-policy data</text></g></svg></g></g></svg>