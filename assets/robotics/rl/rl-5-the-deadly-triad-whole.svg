<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 0 680 1144" role="img" aria-label="Whole mechanism map: The deadly triad: how a guess can train itself upward"><style>.rls-panel-title{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#50554e}</style><g class="rc-panel" data-panel="feedback"><rect x="12" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="36">1. Three pressures, one loop</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="A shared update raises a next-state value, bootstrapping raises the target, and mismatched sampling misses a corrective update"><defs><marker id="canvas-5-0-p5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="150" y="22" text-anchor="middle">shared update</text><path d="M171 31Q264 49 258 93" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="241" y="117" text-anchor="middle">next value</text><text x="241" y="140" text-anchor="middle">rises</text><path d="M227 150Q168 188 101 160" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="66" y="139" text-anchor="middle">target</text><text x="66" y="162" text-anchor="middle">rises</text><path d="M43 115Q27 42 121 30" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><path d="M151 79V131" stroke="#2b6a8e" stroke-width="2" stroke-dasharray="5 4"/><path d="M139 97L163 119M163 97L139 119" stroke="#b44c2c" stroke-width="3"/><text x="150" y="200" text-anchor="middle">sampling misses correction</text></g></svg></g><g class="rc-panel" data-panel="two-state"><rect x="352" y="12" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="36">2. Two states, one weight</text><svg x="364" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Only the transition from value w to value two w is replayed; changing w raises both estimates"><defs><marker id="canvas-5-1-p5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="55" cy="65" r="32" fill="#d7e5ee" stroke="#242622"/><circle cx="224" cy="65" r="32" fill="#d7e5ee" stroke="#242622"/><text x="55" y="59" text-anchor="middle">s₁</text><text x="55" y="81" text-anchor="middle">w</text><text x="224" y="59" text-anchor="middle">s₂</text><text x="224" y="81" text-anchor="middle">2w</text><path d="M89 65H188" stroke="#b44c2c" stroke-width="3" marker-end="url(#canvas-5-1-p5b)"/><text x="140" y="47" text-anchor="middle">R = 0</text><path d="M214 31C185 -1 284 -1 251 43" fill="none" stroke="#777" stroke-width="2" marker-end="url(#canvas-5-1-p5b)"/><path d="M160 71Q149 133 79 104" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-1-p5b)"/><text x="150" y="146" text-anchor="middle">replay s₁ → s₂ only</text><text x="150" y="175" text-anchor="middle">w rises → 2w rises</text><text x="150" y="205" text-anchor="middle">no updates starting at s₂</text></g></svg></g><g class="rc-panel" data-panel="linear-pair"><rect x="12" y="292" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="316">3. Match the prediction distribution</text><svg x="24" y="326" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Bellman prediction followed by projection shrinks the distance between two value estimates in the matching stationary norm"><defs><marker id="canvas-5-2-p5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><circle cx="35" cy="45" r="7" fill="#2b6a8e"/><circle cx="265" cy="45" r="7" fill="#b44c2c"/><path d="M44 45H256" stroke="#777" stroke-width="2"/><text x="150" y="29" text-anchor="middle">two predictions: distance d</text><path d="M35 57L99 110M265 57L201 110" fill="none" stroke="#242622" stroke-width="2" marker-end="url(#canvas-5-2-p5c)"/><text x="150" y="90" text-anchor="middle">Bellman + projection</text><circle cx="104" cy="125" r="7" fill="#2b6a8e"/><circle cx="196" cy="125" r="7" fill="#b44c2c"/><path d="M113 125H187" stroke="#777" stroke-width="2"/><text x="150" y="160" text-anchor="middle">distance ≤ γd</text><text x="150" y="187" text-anchor="middle">same stationary weighting</text><text x="150" y="211" text-anchor="middle">for transitions and fitting</text></g></svg></g><g class="rc-panel" data-panel="fixed-labels"><rect x="352" y="292" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="316">4. Keep the labels fixed</text><svg x="364" y="326" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Predictions move toward labels held fixed as the weights change"><defs><marker id="canvas-5-3-p5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="150" y="24" text-anchor="middle">fixed reward-only labels</text><path d="M32 48H267" stroke="#2b6a8e" stroke-width="2"/><circle cx="60" cy="48" r="6" fill="#2b6a8e"/><circle cx="150" cy="48" r="6" fill="#2b6a8e"/><circle cx="240" cy="48" r="6" fill="#2b6a8e"/><circle cx="60" cy="144" r="6" fill="#b44c2c"/><circle cx="150" cy="120" r="6" fill="#b44c2c"/><circle cx="240" cy="162" r="6" fill="#b44c2c"/><path d="M60 132V63M150 108V63M240 150V63" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-3-p5d)"/><text x="150" y="187" text-anchor="middle">predictions move toward y</text><text x="150" y="212" text-anchor="middle">changing w leaves y fixed</text></g></svg></g><g class="rc-panel" data-panel="tabular-pair"><rect x="12" y="572" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="596">5. Separate the table entries</text><svg x="24" y="606" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="One table cell takes a backup from the next-state row while all other cells stay fixed"><defs><marker id="canvas-5-4-p5e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="150" y="24" text-anchor="middle">independent table entries</text><rect x="73" y="42" width="192" height="111" fill="#fff" stroke="#242622"/><path d="M73 79H265M73 116H265M137 42V153M201 42V153" stroke="#777"/><rect x="137" y="79" width="64" height="37" fill="#d7e5ee"/><text x="40" y="104" text-anchor="middle">s</text><text x="40" y="140" text-anchor="middle">s′</text><text x="105" y="140" text-anchor="middle">2</text><text x="169" y="140" text-anchor="middle">5</text><text x="233" y="140" text-anchor="middle">1</text><path d="M169 149Q293 190 287 96Q285 61 203 87" fill="none" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-4-p5e)"/><text x="150" y="188" text-anchor="middle">max supplies target</text><text x="150" y="213" text-anchor="middle">update one cell only</text></g></svg></g><g class="rc-panel" data-panel="dqn"><rect x="352" y="572" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="364" y="596">6. Slow the target feedback</text><svg x="364" y="606" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="Replay sends a transition to online and frozen networks; only the online network updates until a periodic copy"><defs><marker id="canvas-5-5-p5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><text x="150" y="24" text-anchor="middle">sample a replay transition</text><path d="M125 35L65 70M175 35L235 70" fill="none" stroke="#242622" stroke-width="2" marker-end="url(#canvas-5-5-p5f)"/><rect x="12" y="79" width="116" height="51" fill="#d7e5ee" stroke="#242622"/><rect x="172" y="79" width="116" height="51" fill="#eee" stroke="#242622"/><text x="70" y="100" text-anchor="middle">online θ</text><text x="70" y="121" text-anchor="middle">prediction</text><text x="230" y="100" text-anchor="middle">frozen θ⁻</text><text x="230" y="121" text-anchor="middle">target y</text><path d="M171 145H92" stroke="#b44c2c" stroke-width="2" marker-end="url(#canvas-5-5-p5f)"/><text x="157" y="171" text-anchor="middle">update θ only</text><path d="M65 180Q150 218 239 181" fill="none" stroke="#2b6a8e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#canvas-5-5-p5f)"/><text x="150" y="215" text-anchor="middle">copy θ → θ⁻ periodically</text></g></svg></g><g class="rc-panel" data-panel="diagnostics"><rect x="12" y="852" width="324" height="266" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text class="rls-panel-title" x="24" y="876">7. Check estimates beside rewards</text><svg x="24" y="886" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" role="img" aria-label="The estimate curve crosses a known possible-return bound while zero reward stays flat"><defs><marker id="canvas-5-6-p5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#242622"><path d="M36 175V24M36 175H284" fill="none" stroke="#242622" stroke-width="2" marker-end="url(#canvas-5-6-p5g)"/><path d="M38 99H283" stroke="#777" stroke-width="2" stroke-dasharray="5 4"/><text x="156" y="88" text-anchor="middle">return bound</text><path d="M38 163C125 160 197 139 262 28" fill="none" stroke="#b44c2c" stroke-width="3"/><text x="165" y="42" text-anchor="middle">estimate ↑</text><path d="M38 172H277" stroke="#2b6a8e" stroke-width="3"/><text x="155" y="157" text-anchor="middle">reward stays zero</text><text x="160" y="203" text-anchor="middle">updates →</text><text x="19" y="120" transform="rotate(-90 19 120)" text-anchor="middle">value</text></g></svg></g></svg>
