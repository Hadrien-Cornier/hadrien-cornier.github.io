<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" class="rc-svg" viewBox="0 -57 680 400" width="720" height="424" role="img" aria-label="Two blackboard panels: shared weights, bootstrapping and off-policy data close one feedback loop, and two states sharing one weight grow by 1.08 per replay" color="#f4f1e8"><style>.rls-panel-title{font-family:'Patrick Hand','Chalkboard SE','Comic Neue','Segoe Print',cursive;font-size:16px;font-weight:700;fill:#f4f1e8}</style><rect x="0" y="-57" width="680" height="400" fill="#1d2824"/><defs><clipPath id="thumb-row1"><rect x="0" y="0" width="680" height="288"/></clipPath></defs><g clip-path="url(#thumb-row1)"><g class="rc-panel" data-panel="feedback"><rect x="12" y="12" width="324" height="266" rx="4" fill="#1d2824" stroke="#6f7d75"/><text class="rls-panel-title" x="24" y="36">1. Three pressures, one loop</text><svg x="24" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" aria-hidden="true"><title>The loop, clockwise: a shared-weight update also raises the next state's value, bootstrapping makes that value the next target, and the higher target raises the update again. The correcting update at the next state is never sampled with off-policy data.</title><defs><marker id="canvas-5-0-p5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="&apos;Patrick Hand&apos;,&apos;Chalkboard SE&apos;,&apos;Comic Neue&apos;,&apos;Segoe Print&apos;,cursive" font-size="18" fill="#f4f1e8"><text x="150" y="22" text-anchor="middle">shared update</text><path d="M171 31Q264 49 258 93" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="292" y="40" text-anchor="end" font-size="13" fill="#c3c9bd">shared</text><text x="292" y="55" text-anchor="end" font-size="13" fill="#c3c9bd">weights</text><text x="241" y="117" text-anchor="middle">next value</text><text x="241" y="140" text-anchor="middle">rises</text><path d="M227 150Q168 188 101 160" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="164" y="202" text-anchor="middle" font-size="13" fill="#c3c9bd">bootstrapping: it becomes the target</text><text x="66" y="139" text-anchor="middle">target</text><text x="66" y="162" text-anchor="middle">rises</text><path d="M43 115Q27 42 121 30" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-0-p5a)"/><text x="150" y="66" text-anchor="middle" font-size="13" fill="#93d4ff">correction at s′</text><path d="M151 74V116" stroke="#93d4ff" stroke-width="2" stroke-dasharray="5 4"/><path d="M139 84L163 106M163 84L139 106" stroke="#ff9f88" stroke-width="3"/><text x="150" y="134" text-anchor="middle" font-size="13" fill="#ff9f88">never sampled:</text><text x="150" y="149" text-anchor="middle" font-size="13" fill="#ff9f88">off-policy data</text></g></svg></g><g class="rc-panel" data-panel="two-state"><rect x="352" y="12" width="324" height="266" rx="4" fill="#1d2824" stroke="#6f7d75"/><text class="rls-panel-title" x="364" y="36">2. Two states, one weight</text><svg x="364" y="46" height="220" xmlns="http://www.w3.org/2000/svg" width="300" viewBox="0 0 300 220" aria-hidden="true"><title>Only the transition from value w to value two w is replayed; changing w raises both estimates</title><defs><marker id="canvas-5-1-p5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><g font-family="&apos;Patrick Hand&apos;,&apos;Chalkboard SE&apos;,&apos;Comic Neue&apos;,&apos;Segoe Print&apos;,cursive" font-size="18" fill="#f4f1e8"><circle cx="55" cy="65" r="32" fill="#93d4ff" fill-opacity="0.16" stroke="#f4f1e8"/><circle cx="224" cy="65" r="32" fill="#93d4ff" fill-opacity="0.16" stroke="#f4f1e8"/><text x="55" y="59" text-anchor="middle">s₁</text><text x="55" y="81" text-anchor="middle">w</text><text x="224" y="59" text-anchor="middle">s₂</text><text x="224" y="81" text-anchor="middle">2w</text><path d="M89 65H188" stroke="#ff9f88" stroke-width="3" marker-end="url(#canvas-5-1-p5b)"/><text x="140" y="47" text-anchor="middle">R = 0</text><path d="M214 31C185 -1 284 -1 251 43" fill="none" stroke="#c3c9bd" stroke-width="2" marker-end="url(#canvas-5-1-p5b)"/><path d="M160 71Q149 133 79 104" fill="none" stroke="#ff9f88" stroke-width="2" marker-end="url(#canvas-5-1-p5b)"/><text x="150" y="146" text-anchor="middle">replay s₁ → s₂ only</text><text x="150" y="175" text-anchor="middle" fill="#ff9f88">w × 1.08 per replay</text><text x="150" y="205" text-anchor="middle">no update starts at s₂</text></g></svg></g></g></svg>