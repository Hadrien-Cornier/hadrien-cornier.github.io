<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -10 400 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two problems with a fixed dataset: an action the data never tried, and bad actions mixed in with good ones"><rect x="-40" y="-10" width="400" height="200" fill="#fbfbf8"/><g font-family="Arial,sans-serif" fill="#242622"><rect x="8" y="8" width="148" height="170" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><rect x="164" y="8" width="148" height="170" rx="4" fill="#fbfbf8" stroke="#b6baaf"/><text x="82" y="28" font-size="12" text-anchor="middle" font-weight="700">Missing actions</text><text x="238" y="28" font-size="12" text-anchor="middle" font-weight="700">Bad actions present</text><g fill="#3d6f9e"><circle cx="36" cy="80" r="4"/><circle cx="48" cy="96" r="4"/><circle cx="40" cy="112" r="4"/><circle cx="58" cy="88" r="4"/><circle cx="54" cy="118" r="4"/><circle cx="64" cy="104" r="4"/></g><circle cx="122" cy="96" r="10" fill="none" stroke="#b44c2c" stroke-width="2" stroke-dasharray="4 3"/><text x="122" y="100" font-size="12" text-anchor="middle" fill="#b44c2c">?</text><text x="122" y="128" font-size="10" text-anchor="middle" fill="#b44c2c">never tried</text><text x="50" y="146" font-size="10" text-anchor="middle">recorded</text><text x="82" y="166" font-size="10" text-anchor="middle">Value guesses go uncorrected.</text><g fill="#3d6f9e"><circle cx="196" cy="80" r="4"/><circle cx="214" cy="100" r="4"/><circle cx="200" cy="116" r="4"/><circle cx="226" cy="86" r="4"/><circle cx="236" cy="112" r="4"/></g><g stroke="#b44c2c" stroke-width="2.2"><path d="M252,88 l8,8 m0,-8 l-8,8"/><path d="M262,108 l8,8 m0,-8 l-8,8"/><path d="M244,120 l8,8 m0,-8 l-8,8"/></g><text x="238" y="146" font-size="10" text-anchor="middle">good and bad, both recorded</text><text x="238" y="166" font-size="10" text-anchor="middle">Copying keeps the mistakes.</text></g></svg>
