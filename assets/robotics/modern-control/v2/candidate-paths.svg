<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
<title id="title">Compare paths from the same observation</title><desc id="desc">Two identical top views of an arm, block, tray and obstacle. One dashed path goes around the obstacle. The other passes through it, with the conflict circled.</desc><defs>
