<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
<title id="title">A fresh image changes the reach</title><desc id="desc">The same arm and table before and after a green block moves. The old location is outlined. A dashed new reach ends at the moved block.</desc><defs>
