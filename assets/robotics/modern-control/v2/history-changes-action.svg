<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">The same image needs different task history</title><desc id="desc">One shared current view of the arm and block branches into two task records. Inspection pending leads to inspect first; inspection done leads to put away.</desc><defs>
<linearGradient id="table" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e7e0d0"/></linearGradient>
<linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ebf0f4"/><stop offset="1" stop-color="#9cabb7"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#233b4d" flood-opacity=".13"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e8b" stroke-width="1.5"/></marker>
<marker id="amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#c48228" stroke-width="1.5"/></marker>
</defs>
<rect width="600" height="380" rx="22" fill="#f2f5f3"/><text x="20" y="38" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#233b4d" text-anchor="start">Same current view</text><g transform="translate(197 49) scale(.74)"><g transform="translate(0 0)"><rect width="280" height="235" rx="18" fill="url(#table)" stroke="#d6d9d1"/><rect x="207" y="24" width="51" height="41" rx="8" fill="#cbd7db" stroke="#8ba1aa" stroke-width="2"/><rect x="214" y="31" width="37" height="27" rx="4" fill="#e7eff0"/><g filter="url(#shadow)">
    <ellipse cx="48" cy="185" rx="28" ry="11" fill="#b2bcbf"/>
    <rect x="23" y="170" width="50" height="14" rx="5" fill="#627582"/>
    <path d="M48 171L61.68356316821326 41.72215928852495L189 68" fill="none" stroke="#536e80" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 171L61.68356316821326 41.72215928852495L189 68" fill="none" stroke="url(#metal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="171" r="15" fill="#526b7c"/><circle cx="48" cy="171" r="6" fill="#dce5eb"/>
    <circle cx="61.68356316821326" cy="41.72215928852495" r="12" fill="#526b7c"/><circle cx="61.68356316821326" cy="41.72215928852495" r="5" fill="#dce5eb"/>
    </g><g transform="translate(189 88) rotate(0)">
    <rect x="-11" y="-18" width="22" height="18" rx="4" fill="#233b4d"/>
    <path d="M-27 -2V18H-22M27 -2V18H22" fill="none" stroke="#233b4d" stroke-width="5" stroke-linejoin="round"/>
    </g><g transform="translate(190 112) rotate(-14)" filter="url(#shadow)">
    <path d="M-17 -10L15 -10L19 -6L19 12L-13 12L-17 8Z" fill="#375d28"/>
    <rect x="-17" y="-10" width="32" height="18" rx="5" fill="#78a555"/>
    <path d="M-11 -5H8" stroke="#b3d394" stroke-width="3" stroke-linecap="round"/>
    </g></g></g><path d="M300 231V253M300 253H158V269M300 253H442V269" fill="none" stroke="#829895" stroke-width="2"/><rect x="14" y="278" width="278" height="86" rx="14" fill="#fffdf7" stroke="#d6d9d1"/><rect x="308" y="278" width="278" height="86" rx="14" fill="#fffdf7" stroke="#d6d9d1"/><text x="30" y="309" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#233b4d" text-anchor="start">Inspection pending</text><text x="324" y="309" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#233b4d" text-anchor="start">Inspection done</text><text x="30" y="345" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#087e8b" text-anchor="start">Inspect first</text><text x="324" y="345" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#087e8b" text-anchor="start">Put away</text></svg>