<svg class="ft-graph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="group" aria-labelledby="ft-title ft-desc"><title id="ft-title">One reinforcement learning family tree, eight problems</title><desc id="ft-desc">Nine shared method nodes connected by eight numbered edges. Trial and error branches to exploration and Monte Carlo; Monte Carlo to Q-learning; Q-learning to n-step TD, Sarsa, Double Q-learning and DQN; Sarsa to Expected Sarsa. Each numbered edge opens its problem explanation and failure drawing. The map groups methods by the problems they address.</desc><defs><marker id="ft-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#656b62" stroke-width="1.4"/></marker></defs><rect width="800" height="920" fill="#f5f4ed"/><a class="ft-edge-link" data-ft-edge="1" href="#ft-edge-1" aria-label="1. A lucky first result can trap a greedy choice"><g data-edge="1" data-parent="trial" data-child="explore"><path class="ft-branch" d="M350,75 C290,115 150,105 150,180" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="35.0" y="85" width="230" height="78" rx="7" fill="#f5f4ed"/><circle cx="150" cy="96" r="18" fill="#b44c2c"/><text x="150" y="103" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">1</text><text x="150" y="132" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="150">Lucky early</tspan><tspan x="150" dy="25">payouts</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="2" href="#ft-edge-2" aria-label="2. The reward arrives after the choices that earned it"><g data-edge="2" data-parent="trial" data-child="mc"><path class="ft-branch" d="M450,75 C505,115 610,105 610,180" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="495.0" y="85" width="230" height="78" rx="7" fill="#f5f4ed"/><circle cx="610" cy="96" r="18" fill="#b44c2c"/><text x="610" y="103" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">2</text><text x="610" y="132" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="610">Rewards</tspan><tspan x="610" dy="25">arrive late</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="3" href="#ft-edge-3" aria-label="3. Waiting for a complete outcome delays learning"><g data-edge="3" data-parent="mc" data-child="q"><path class="ft-branch" d="M610,240 C610,305 400,305 400,375" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="405.0" y="270" width="230" height="78" rx="7" fill="#f5f4ed"/><circle cx="520" cy="281" r="18" fill="#b44c2c"/><text x="520" y="288" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">3</text><text x="520" y="317" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="520">Waits for</tspan><tspan x="520" dy="25">episode end</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="4" href="#ft-edge-4" aria-label="4. One-step backups can move a late reward slowly"><g data-edge="4" data-parent="q" data-child="nstep"><path class="ft-branch" d="M345,435 C300,475 100,465 100,622" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="8.0" y="490" width="184" height="78" rx="7" fill="#f5f4ed"/><circle cx="100" cy="501" r="18" fill="#b44c2c"/><text x="100" y="508" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">4</text><text x="100" y="537" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="100">Slow one-step</tspan><tspan x="100" dy="25">backups</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="5" href="#ft-edge-5" aria-label="5. The greedy target can miss the risk of exploratory moves"><g data-edge="5" data-parent="q" data-child="sarsa"><path class="ft-branch" d="M380,435 C380,495 300,505 300,622" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="208.0" y="490" width="184" height="78" rx="7" fill="#f5f4ed"/><circle cx="300" cy="501" r="18" fill="#b44c2c"/><text x="300" y="508" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">5</text><text x="300" y="537" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="300">Exploratory</tspan><tspan x="300" dy="25">risk</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="6" href="#ft-edge-6" aria-label="6. Sampling one next action adds noise to the target"><g data-edge="6" data-parent="sarsa" data-child="expected"><path class="ft-branch" d="M300,688 C300,735 300,780 300,830" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="185.0" y="715" width="230" height="78" rx="7" fill="#f5f4ed"/><circle cx="300" cy="726" r="18" fill="#b44c2c"/><text x="300" y="733" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">6</text><text x="300" y="762" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="300">Noisy next</tspan><tspan x="300" dy="25">action sample</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="7" href="#ft-edge-7" aria-label="7. The largest noisy estimate often won by getting lucky"><g data-edge="7" data-parent="q" data-child="double"><path class="ft-branch" d="M420,435 C420,495 500,505 500,622" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="408.0" y="490" width="184" height="78" rx="7" fill="#f5f4ed"/><circle cx="500" cy="501" r="18" fill="#b44c2c"/><text x="500" y="508" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">7</text><text x="500" y="537" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="500">Lucky</tspan><tspan x="500" dy="25">maxima</tspan></text></g></a><a class="ft-edge-link" data-ft-edge="8" href="#ft-edge-8" aria-label="8. A table cannot cover a large state space"><g data-edge="8" data-parent="q" data-child="dqn"><path class="ft-branch" d="M455,435 C500,475 700,465 700,622" fill="none" stroke="#656b62" stroke-width="2.5" marker-end="url(#ft-arrow)"/><rect class="ft-edge-label" x="608.0" y="490" width="184" height="78" rx="7" fill="#f5f4ed"/><circle cx="700" cy="501" r="18" fill="#b44c2c"/><text x="700" y="508" text-anchor="middle" fill="#fff" font-size="21" font-family="Arial,sans-serif" font-weight="700">8</text><text x="700" y="537" text-anchor="middle" fill="#242622" font-size="22" font-family="Arial,sans-serif"><tspan x="700">Too many</tspan><tspan x="700" dy="25">table rows</tspan></text></g></a><g data-node="trial"><rect x="290.0" y="25.0" width="220" height="50" rx="5" fill="#fff" stroke="#242622" stroke-width="2"/><text x="400" y="58" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="400" dy="0">Trial and error</tspan></text></g><g data-node="explore"><rect x="30.0" y="180.0" width="240" height="60" rx="5" fill="#fff" stroke="#242622" stroke-width="2"/><text x="150" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="150" dy="0">ε-greedy</tspan><tspan x="150" dy="25">exploration</tspan></text></g><g data-node="mc"><rect x="510.0" y="180.0" width="200" height="60" rx="5" fill="#fff" stroke="#242622" stroke-width="2"/><text x="610" y="218" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="610" dy="0">Monte Carlo</tspan></text></g><g data-node="q"><rect x="290.0" y="375.0" width="220" height="60" rx="5" fill="#d7e5ee" stroke="#242622" stroke-width="2"/><text x="400" y="413" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="400" dy="0">Q-learning · 1</tspan></text></g><g data-node="nstep"><rect x="13.0" y="622.0" width="174" height="66" rx="5" fill="#d7e5ee" stroke="#242622" stroke-width="2"/><text x="100" y="650" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="100" dy="0">n-step TD</tspan><tspan x="100" dy="25">part 2</tspan></text></g><g data-node="sarsa"><rect x="213.0" y="622.0" width="174" height="66" rx="5" fill="#d7e5ee" stroke="#242622" stroke-width="2"/><text x="300" y="663" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="300" dy="0">Sarsa · 4</tspan></text></g><g data-node="double"><rect x="413.0" y="622.0" width="174" height="66" rx="5" fill="#fff" stroke="#242622" stroke-width="2"/><text x="500" y="650" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="500" dy="0">Double</tspan><tspan x="500" dy="25">Q-learning</tspan></text></g><g data-node="dqn"><rect x="613.0" y="622.0" width="174" height="66" rx="5" fill="#d7e5ee" stroke="#242622" stroke-width="2"/><text x="700" y="663" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="700" dy="0">DQN · 3</tspan></text></g><g data-node="expected"><rect x="190.0" y="830.0" width="220" height="60" rx="5" fill="#fff" stroke="#242622" stroke-width="2"/><text x="300" y="868" text-anchor="middle" font-size="23" font-weight="700" fill="#242622" font-family="Arial,sans-serif"><tspan x="300" dy="0">Expected Sarsa</tspan></text></g></svg>
