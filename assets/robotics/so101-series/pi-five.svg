<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 469.44 338.22" stroke-linejoin="round" stroke-linecap="butt"><path d="M 33.84 187.79 L 108.61 187.79 L 108.61 133.33 L 33.84 133.33 z" clip-path="url(#pi-five-p00275e74b8)" style="fill: #9fb4c4; stroke: #f4f1e8; stroke-width: 1.6; stroke-linejoin: miter"/><path d="M 111.96 187.79 L 308.38 187.79 L 308.38 133.33 L 111.96 133.33 z" clip-path="url(#pi-five-p00275e74b8)" style="fill: #93d4ff; stroke: #f4f1e8; stroke-width: 1.6; stroke-linejoin: miter"/><path d="M 312.84 187.79 L 435.6 187.79 L 435.6 133.33 L 312.84 133.33 z" clip-path="url(#pi-five-p00275e74b8)" style="fill: #24312c; stroke: #f4f1e8; stroke-width: 1.6; stroke-linejoin: miter"/><text style="font-size: 15px; text-anchor: middle; fill: #f4f1e8" x="234.72" y="92.21" transform="rotate(-0 234.72 92.21)">A gap split across the inner and outer loops</text><text style="font-size: 15px; fill: #1d2824" transform="translate(51.73 152.55)">e servo</text><text style="font-size: 15px; fill: #1d2824" transform="translate(53.83 174.48)">spring</text><text style="font-size: 15px; fill: #1d2824" transform="translate(204.37 153.99)">4e</text><text style="font-size: 15px; fill: #1d2824" transform="translate(190.36 177.34)">outer P</text><text style="font-size: 15px; text-anchor: middle; fill: #f4f1e8" x="374.22" y="165.89" transform="rotate(-0 374.22 165.89)">offset</text><text style="font-size: 15px; text-anchor: start; fill: #c3c9bd" x="33.84" y="214.24" transform="rotate(-0 33.84 214.24)">gap = e</text><text style="font-size: 15px; text-anchor: start; fill: #c3c9bd" x="111.96" y="214.24" transform="rotate(-0 111.96 214.24)">+ 4e</text><text style="font-size: 15px; text-anchor: start; fill: #c3c9bd" x="312.84" y="214.24" transform="rotate(-0 312.84 214.24)">+ offset</text><text style="font-size: 19px; text-anchor: middle; fill: #f4f1e8" x="234.72" y="257.9" transform="rotate(-0 234.72 257.9)">goal - q = 5e + offset</text><text style="font-size: 15px; fill: #a8e2a0" tran