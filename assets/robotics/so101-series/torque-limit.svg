oin: miter; stroke-linecap: square"/><text style="font-size: 15px; text-anchor: end; fill: #f4f1e8" x="415.93" y="108.02" transform="rotate(-0 415.93 108.02)">wall</text><text style="font-size: 15px; text-anchor: start; fill: #ff93b8" x="73.49" y="156.8" transform="rotate(-0 73.49 156.8)">late brake needs 7 N m</text><text style="font-size: 15px; text-anchor: start; fill: #a8e2a0" x="73.49" y="209.72" transform="rotate(-0 73.49 209.72)">early brake needs 3 N m</text><text style="font-size: 17.5px; fill: #ffe17c" transform="translate(66.82 25.48)">Late braking can exceed</text><text style="font-size: 17.5px; fill: #ffe17c" transform="translate(66.82 46.52)">the servo torque limit</text><path d="M 79.42 80.56 L 93.42 80.56 L 107.42 80.56" style="fill: none; stroke: #ff93b8; stroke-width: 2.6; stroke-linecap: square"/><text style="font-size: 14px; text-anchor: start; fill: #f4f1e8" x="118.62" y="85.46" transform="rotate(-0 118.62 85.46)">late brake, 7 N m</text><path d="M 79.42 106.26 L 93.42 106.26 L 107.42 106.26" style="fill: none; stroke: #a8e2a0; stroke-width: 2.6; stroke-linecap: square"/><text style="font-size: 14px; text-anchor: start; fill: #f4f1e8" x="118.62" y="111.16" transform="rotate(-0 118.62 111.16)">early brake, 3 N m</text><path d="M 79.42 131.96 L 93.42 131.96 L 107.42 131.96" style="fill: none; stroke-dasharray: 7.4,3.2; stroke-dashoffset: 0; stroke: #ff93b8; stroke-width: 2"/><text style="font-size: 14px; text-anchor: start; fill: #f4f1e8" x="118.62" y="136.86" transform="rotate(-0 118.62 136.86)">torque clamp = 5.107 N m</text><text style="font-size: 14px; fill: #c3c9bd" transform="translate(11.52 373.98)">A planner that sees the stop coming can brake early</text><text style="font-size: 14px; fill: #c3c9bd" transform="translate(11.52 390.84)">and stay under the torque limit. J = 0.06 kg m².</text><defs><clipPath id="torque-limit-pdf625261dd"><rect x="66.82" y="58.52" width="382.46" height="241.92"/></clipPath></defs></svg>
