; stroke: #c3c9bd; stroke-width: 1.7; stroke-linejoin: miter; stroke-linecap: square"/><text style="font-size: 15px; text-anchor: end; fill: #f4f1e8" x="415.93" y="108.18" transform="rotate(-0 415.93 108.18)">wall</text><text style="font-size: 15px; text-anchor: start; fill: #ff93b8" x="73.49" y="156.96" transform="rotate(-0 73.49 156.96)">late brake needs 7 N m</text><text style="font-size: 15px; text-anchor: start; fill: #a8e2a0" x="73.49" y="209.88" transform="rotate(-0 73.49 209.88)">early brake needs 3 N m</text><text style="font-size: 17.5px; fill: #ffe17c" transform="translate(66.82 25.64)">Late braking can exceed</text><text style="font-size: 17.5px; fill: #ffe17c" transform="translate(66.82 46.68)">the servo torque limit</text><path d="M 79.42 80.72 L 93.42 80.72 L 107.42 80.72" style="fill: none; stroke: #ff93b8; stroke-width: 2.6; stroke-linecap: square"/><text style="font-size: 14px; text-anchor: start; fill: #f4f1e8" x="118.62" y="85.62" transform="rotate(-0 118.62 85.62)">late brake, 7 N m</text><path d="M 79.42 106.42 L 93.42 106.42 L 107.42 106.42" style="fill: none; stroke: #a8e2a0; stroke-width: 2.6; stroke-linecap: square"/><text style="font-size: 14px; text-anchor: start; fill: #f4f1e8" x="118.62" y="111.32" transform="rotate(-0 118.62 111.32)">early brake, 3 N m</text><path d="M 79.42 132.13 L 93.42 132.13 L 107.42 132.13" style="fill: none; stroke-dasharray: 7.4,3.2; stroke-dashoffset: 0; stroke: #ff93b8; stroke-width: 2"/><text style="font-size: 14px; text-anchor: start; fill: #f4f1e8" x="118.62" y="137.03" transform="rotate(-0 118.62 137.03)">torque clamp = 5.107 N m</text><text style="font-size: 14px; fill: #c3c9bd" transform="translate(11.52 374.14)">A planner that sees the stop coming can brake early</text><text style="font-size: 14px; fill: #c3c9bd" transform="translate(11.52 391)">and stay under the torque limit. J = 0.06 kg m².</text><defs><clipPath id="torque-limit-p9a3454c8da"><rect x="66.82" y="58.68" width="382.46" height="241.92"/>