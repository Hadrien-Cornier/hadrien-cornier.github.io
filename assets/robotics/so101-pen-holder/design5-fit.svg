yle="font-size: 14px; fill: #f4f1e8" transform="translate(101.69 299.33)">Print: 1 sleeve (27.2 g) and 3 identical M8 thumbscrews</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(170.76 320.84)">(2.1 g each). Nothing to buy.</text><defs><clipPath id="design5-fit-p7ab75049a6"><rect x="11.52" y="115.92" width="153.6" height="154.89"/></clipPath><clipPath id="design5-fit-p1d8cf12554"><rect x="165.12" y="115.92" width="153.6" height="154.89"/></clipPath><clipPath id="design5-fit-pc421d98965"><rect x="318.72" y="115.92" width="153.6" height="154.89"/></clipPath><clipPath id="design5-fit-p306e68a092"><rect x="11.57" y="328.41" width="153.5" height="142.85"/></clipPath><clipPath id="design5-fit-p3999e521f3"><rect x="165.17" y="328.41" width="153.5" height="142.85"/></clipPath><clipPath id="design5-fit-p23cae8d57f"><rect x="318.77" y="328.41" width="153.5" height="142.85"/></clipPath></defs></svg>
