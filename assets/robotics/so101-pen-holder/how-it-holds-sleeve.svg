<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400.32 364.35" stroke-linejoin="round" stroke-linecap="butt"><g clip-path="url(#how-it-holds-sleeve-p0fa85052a6)"><image href="/assets/robotics/so101-pen-holder/how-it-holds-sleeve.svg.image0.png" transform="scale(1 -1) translate(0 -201.6)" x="159.71" y="-45.26" width="154.8" height="201.6"/></g><path d="M 152.05 160.72 Q 186.48 160.72 218.68 160.72" style="fill: none; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 213.08 157.92 L 218.68 160.72 L 213.08 163.52 z" style="fill: #ff9f88; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 45.82 181.12 L 147.6 181.12 Q 151.5 181.12 151.5 177.22 L 151.5 144.22 Q 151.5 140.32 147.6 140.32 L 45.82 140.32 Q 41.92 140.32 41.92 144.22 L 41.92 177.22 Q 41.92 181.12 45.82 181.12 z" style="fill: #1d2824; stroke: #c3c9bd; stroke-width: 1.1; stroke-linejoin: miter"/><text style="font-size: 13px; fill: #f4f1e8" transform="translate(45.82 155.09)">The stock fixed finger,</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(99.02 171.59)">unchanged</text><path d="M 151.13 187.81 Q 163.12 182.96 173.04 178.94" style="fill: none; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 166.79 178.45 L 173.04 178.94 L 168.89 183.64 z" style="fill: #ff9f88; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 17.6 244.18 L 147.6 244.18 Q 151.5 244.18 151.5 240.28 L 151.5 190.78 Q 151.5 186.88 147.6 186.88 L 17.6 186.88 Q 13.7 186.88 13.7 190.78 L 13.7 240.28 Q 13.7 244.18 17.6 244.18 z" style="fill: #1d2824; stroke: #c3c9bd; stroke-width: 1.1; stroke-linejoin: miter"/><text style="font-size: 13px; fill: #f4f1e8" transform="translate(17.6 201.65)">Side thumbscrew: it presses</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(33.13 218.15)">the finger. Friction holds</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(66.22 236.32)">the sleeve DOWN.</text><path d="M 152.05 260.34 Q 187.75 239.37 221.53 219.53" style="fill: none; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 215.28 219.95 L 221.53 219.53 L 218.12 224.78 z" style="fill: #ff9f88; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 10.1 356.73 L 147.6 356.73 Q 151.5 356.73 151.5 352.83 L 151.5 253.84 Q 151.5 249.94 147.6 249.94 L 10.1 249.94 Q 6.2 249.94 6.2 253.84 L 6.2 352.83 Q 6.2 356.73 10.1 356.73 z" style="fill: #1d2824; stroke: #c3c9bd; stroke-width: 1.1; stroke-linejoin: miter"/><text style="font-size: 13px; fill: #f4f1e8" transform="translate(32.02 264.71)">The finger gets narrower</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(27.55 283.17)">toward its end. The sleeve</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(36.98 297.7)">stops on it like a wedge,</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(10.1 314.21)">so it cannot go UP. The paper</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(38.3 330.71)">pushes the pen up, onto</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(104.23 349.17)">this seat.</text><path d="M 318.83 111.52 Q 297.65 111.52 278.71 111.52" style="fill: none; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 284.31 114.32 L 278.71 111.52 L 284.31 108.72 z" style="fill: #ff9f88; stroke: #ff9f88; stroke-width: 2; stroke-linecap: round"/><path d="M 323.28 148.42 L 389.5 148.42 Q 393.4 148.42 393.4 144.52 L 393.4 78.52 Q 393.4 74.62 389.5 74.62 L 323.28 74.62 Q 319.38 74.62 319.38 78.52 L 319.38 144.52 Q 319.38 148.42 323.28 148.42 z" style="fill: #1d2824; stroke: #c3c9bd; stroke-width: 1.1; stroke-linejoin: miter"/><text style="font-size: 13px; fill: #f4f1e8" transform="translate(323.28 89.4)">The pen leans</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(323.28 107.33)">20°, so it is</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(323.28 124.35)">vertical when</text><text style="font-size: 13px; fill: #f4f1e8" transform="translate(323.28 140.85)">the arm draws</text><text style="font-size: 17px; text-anchor: middle; fill: #ffe17c" x="200.16" y="28.93" transform="rotate(-0 200.16 28.93)">Behind the finger: what holds the sleeve</text><defs><clipPath id="how-it-holds-sleeve-p0fa85052a6"><rect x="159.84" y="45.36" width="154.8" height="201.45"/></clipPath></defs></svg>
