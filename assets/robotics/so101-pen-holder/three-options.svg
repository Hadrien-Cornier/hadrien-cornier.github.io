<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474.76 504.09" stroke-linejoin="round" stroke-linecap="butt"><g clip-path="url(#three-options-pbe21b95eb2)"><image href="/assets/robotics/so101-pen-holder/three-options.svg.image0.png" transform="scale(1 -1) translate(0 -168.87)" x="32.4" y="-143.11" width="138.11" height="168.87"/></g><g clip-path="url(#three-options-pab80891418)"><image href="/assets/robotics/so101-pen-holder/three-options.svg.image1.png" transform="scale(1 -1) translate(0 -168.87)" x="178.69" y="-143.11" width="138.11" height="168.87"/></g><g clip-path="url(#three-options-p6183b0864c)"><image href="/assets/robotics/so101-pen-holder/three-options.svg.image2.png" transform="scale(1 -1) translate(0 -168.87)" x="324.98" y="-143.11" width="138.11" height="168.87"/></g><g clip-path="url(#three-options-pc7abf0f4a1)"><image href="/assets/robotics/so101-pen-holder/three-options.svg.image3.png" transform="scale(1 -1) translate(0 -174.76)" x="32.4" y="-317.87" width="138.11" height="174.76"/></g><g clip-path="url(#three-options-pe290aca7f3)"><image href="/assets/robotics/so101-pen-holder/three-options.svg.image4.png" transform="scale(1 -1) translate(0 -174.76)" x="178.69" y="-317.87" width="138.11" height="174.76"/></g><g clip-path="url(#three-options-pa189fc4417)"><image href="/assets/robotics/so101-pen-holder/three-options.svg.image5.png" transform="scale(1 -1) translate(0 -174.76)" x="324.98" y="-317.87" width="138.11" height="174.76"/></g><text style="font-size: 15px; fill: #f4f1e8" transform="translate(77.69 25.07)">SO-101 pen holder: three options. Blue = the part you print;</text><text style="font-size: 15px; fill: #f4f1e8" transform="translate(67.76 46.11)">yellow = the parts that stay; orange = printed M8 thumbscrews.</text><text style="font-size: 15px; fill: #f4f1e8" transform="translate(74.61 67.73)">Option 1 is design 5 and option 3 is design 4 (all checks pass).</text><text style="font-size: 15px; fill: #f4f1e8" transform="translate(89.86 88.77)">Option 2 is a concept (only collision and mass checked).</text><text style="font-size: 15px; fill: #ffe17c" transform="translate(43.13 113.84)">1  Sleeve on the stock</text><text style="font-size: 15px; fill: #ffe17c" transform="translate(56.85 132.16)">finger (design 5)</text><text style="font-size: 15px; text-anchor: middle; fill: #ffe17c" x="247.82" y="131.18" transform="rotate(-0 247.82 131.18)">2  New moving jaw</text><text style="font-size: 15px; fill: #ffe17c" transform="translate(352.97 111.92)">3  New fixed jaw</text><text style="font-size: 15px; fill: #ffe17c" transform="translate(367.14 132.16)">(design 4)</text><text style="font-size: 14px; fill: #c3c9bd" transform="translate(25.86 248.36) rotate(-90)">3/4 view</text><text style="font-size: 14px; fill: #c3c9bd" transform="translate(25.86 427.52) rotate(-90)">Side view</text><defs><clipPath id="three-options-pbe21b95eb2"><rect x="32.39" y="143.15" width="138.24" height="168.96"/></clipPath><clipPath id="three-options-pab80891418"><rect x="178.7" y="143.15" width="138.24" height="168.96"/></clipPath><clipPath id="three-options-p6183b0864c"><rect x="325" y="143.15" width="138.24" height="168.96"/></clipPath><clipPath id="three-options-pc7abf0f4a1"><rect x="32.39" y="317.87" width="138.24" height="174.7"/></clipPath><clipPath id="three-options-pe290aca7f3"><rect x="178.7" y="317.87" width="138.24" height="174.7"/></clipPath><clipPath id="three-options-pa189fc4417"><rect x="325" y="317.87" width="138.24" height="174.7"/></clipPath></defs></svg>
