<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470.02 417.92" stroke-linejoin="round" stroke-linecap="butt"><g clip-path="url(#design-history-pcdead6203d)"><image href="/assets/robotics/so101-pen-holder/design-history.svg.image0.png" transform="scale(1 -1) translate(0 -135.82)" x="11.45" y="-87.05" width="84.76" height="135.82"/></g><g clip-path="url(#design-history-p6a743f2dc7)"><image href="/assets/robotics/so101-pen-holder/design-history.svg.image1.png" transform="scale(1 -1) translate(0 -135.82)" x="102.11" y="-87.05" width="84.76" height="135.82"/></g><g clip-path="url(#design-history-p0601465788)"><image href="/assets/robotics/so101-pen-holder/design-history.svg.image2.png" transform="scale(1 -1) translate(0 -135.82)" x="192.76" y="-87.05" width="84.76" height="135.82"/></g><g clip-path="url(#design-history-p166fa4d888)"><image href="/assets/robotics/so101-pen-holder/design-history.svg.image3.png" transform="scale(1 -1) translate(0 -135.82)" x="283.09" y="-87.05" width="84.76" height="135.82"/></g><g clip-path="url(#design-history-paf7f421aa4)"><image href="/assets/robotics/so101-pen-holder/design-history.svg.image4.png" transform="scale(1 -1) translate(0 -135.82)" x="373.75" y="-87.05" width="84.76" height="135.82"/></g><path d="M 373.71 87.17 L 458.5 87.17 L 458.5 222.83 L 373.71 222.83 L 373.71 87.17 z" style="fill: none; stroke: #a8e2a0; stroke-width: 2.4; stroke-linejoin: miter"/><text style="font-size: 15px; fill: #f4f1e8" transform="translate(77.93 25.07)">Five designs, from the first idea to the sleeve. Same camera,</text><text style="font-size: 15px; fill: #f4f1e8" transform="translate(77.62 46.69)">same gripper (yellow). The printed holder parts are in color.</text><text style="font-size: 19px; text-anchor: middle; fill: #ffe17c" x="53.91" y="77.88" transform="rotate(-0 53.91 77.88)">1</text><text style="font-size: 19px; text-anchor: middle; fill: #ffe17c" x="144.46" y="77.88" transform="rotate(-0 144.46 77.88)">2</text><text style="font-size: 19px; text-anchor: middle; fill: #ffe17c" x="235.01" y="77.88" transform="rotate(-0 235.01 77.88)">3</text><text style="font-size: 19px; text-anchor: middle; fill: #ffe17c" x="325.56" y="77.88" transform="rotate(-0 325.56 77.88)">4</text><text style="font-size: 19px; text-anchor: middle; fill: #a8e2a0" x="416.1" y="77.88" transform="rotate(-0 416.1 77.88)">5</text><text style="font-size: 16px; text-anchor: start; fill: #ffe17c" x="14.28" y="250.74" transform="rotate(-0 14.28 250.74)">1  Pen on the roll axis</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(35.02 268.07)">a slide and 4 sleeves</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(35.02 286.78)">the arm cannot reach the table</text><text style="font-size: 16px; text-anchor: start; fill: #ffe17c" x="14.28" y="308.34" transform="rotate(-0 14.28 308.34)">2  Pen beside the fingers</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(35.02 323.57)">the same slide, about 20 parts</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(35.02 342.28)">to print, buy and glue</text><text style="font-size: 16px; text-anchor: start; fill: #ffe17c" x="14.28" y="365.94" transform="rotate(-0 14.28 365.94)">3  Two V clamps, one part</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(35.02 381.17)">any pen from 8 to 13 mm</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(35.02 399.88)">but you must drill the finger</text><text style="font-size: 16px; text-anchor: start; fill: #ffe17c" x="249.29" y="250.74" transform="rotate(-0 249.29 250.74)">4  A new fixed jaw</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(270.03 265.97)">no bolts, no slip</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(270.03 284.68)">but a large print and disassembly</text><text style="font-size: 16px; text-anchor: start; fill: #a8e2a0" x="249.29" y="308.34" transform="rotate(-0 249.29 308.34)">5  A sleeve on the stock finger</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(270.03 323.57)">4 small printed parts</text><text style="font-size: 14px; fill: #f4f1e8" transform="translate(270.03 342.28)">nothing to buy, no disassembly</text><defs><clipPath id="design-history-pcdead6203d"><rect x="11.52" y="87.17" width="84.79" height="135.66"/></clipPath><clipPath id="design-history-p6a743f2dc7"><rect x="102.07" y="87.17" width="84.79" height="135.66"/></clipPath><clipPath id="design-history-p0601465788"><rect x="192.61" y="87.17" width="84.79" height="135.66"/></clipPath><clipPath id="design-history-p166fa4d888"><rect x="283.16" y="87.17" width="84.79" height="135.66"/></clipPath><clipPath id="design-history-paf7f421aa4"><rect x="373.71" y="87.17" width="84.79" height="135.66"/></clipPath></defs></svg>
