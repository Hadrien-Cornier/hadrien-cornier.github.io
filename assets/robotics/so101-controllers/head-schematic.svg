; stroke: #ff9f88; stroke-width: 2; stroke-linejoin: miter"/><path d="M 300.52 301.68 L 434.52 301.68 Q 441.52 301.68 441.52 308.68 L 441.52 348.12 Q 441.52 355.12 434.52 355.12 L 300.52 355.12 Q 293.52 355.12 293.52 348.12 L 293.52 308.68 Q 293.52 301.68 300.52 301.68 z" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: #ff9f88; fill-opacity: 0.1; stroke: #ff9f88; stroke-width: 2; stroke-linejoin: miter"/><path d="M 367.52 186.4 L 363.52 178.4 L 371.52 178.4 z" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: #ff9f88; stroke: #ff9f88; stroke-linejoin: miter"/><path d="M 367.52 301.68 L 363.52 293.68 L 371.52 293.68 z" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: #ff9f88; stroke: #ff9f88; stroke-linejoin: miter"/><path d="M 269.52 252.96 L 277.52 248.96 L 277.52 256.96 z" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: #ff9f88; stroke: #ff9f88; stroke-linejoin: miter"/><path d="M 159.52 76.96 L 159.52 99.76" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #c3c9bd; stroke-width: 2; stroke-linejoin: miter"/><path d="M 159.52 196.24 L 159.52 219.04" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #c3c9bd; stroke-width: 2; stroke-linejoin: miter"/><path d="M 159.52 279.68 L 159.52 302.48" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #c3c9bd; stroke-width: 2; stroke-linejoin: miter"/><path d="M 159.52 363.12 L 159.52 379.42" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #c3c9bd; stroke-width: 2; stroke-linejoin: miter"/><path d="M 159.52 407.62 L 159.52 421.92" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #c3c9bd; stroke-width: 2; stroke-linejoin: miter"/><path d="M 49.52 50.24 L 27.52 50.24 L 27.52 397.12 L 141.82 397.12" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #c3c9bd; stroke-width: 2; stroke-linejoin: miter"/><path d="M 367.52 160.4 L 367.52 179.2" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #ff9f88; stroke-width: 2; stroke-linejoin: miter"/><path d="M 367.52 275.68 L 367.52 294.48" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke: #ff9f88; stroke-width: 2; stroke-linejoin: miter"/><path d="M 293.52 328.4 L 281.52 328.4 L 281.52 252.96 L 276.72 252.96" clip-path="url(#head-schematic-pcee40f9d3c)" style="fill: none; stroke-dasharray: 10,8; stroke-dashoffset: 0; stroke: #ff9f88; stroke-width: 2"/><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="159.52" y="47.2" transform="rotate(-0 159.52 47.2)">Planned joint path q*(t)</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="64.76" transform="rotate(-0 159.52 64.76)">from the drawing, five joints</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="159.52" y="130.64" transform="rotate(-0 159.52 130.64)">Features of the path</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="148.2" transform="rotate(-0 159.52 148.2)">for each joint: sin, cos, angle,</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="166.12" transform="rotate(-0 159.52 166.12)">speed, acceleration, saturated speed</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="184.04" transform="rotate(-0 159.52 184.04)">30 numbers + 1 constant</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="159.52" y="249.92" transform="rotate(-0 159.52 249.92)">Linear map W</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="267.48" transform="rotate(-0 159.52 267.48)">5 × 31 weights, one row per joint</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="159.52" y="333.36" transform="rotate(-0 159.52 333.36)">Joint offsets g</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="350.92" transform="rotate(-0 159.52 350.92)">a few mrad, added to the goals</text><text style="font-size: 17px; text-anchor: middle; fill: #f4f1e8" x="159.52" y="405.82" transform="rotate(-0 159.52 405.82)">+</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="159.52" y="452.8" transform="rotate(-0 159.52 452.8)">To the physics controller</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="159.52" y="470.36" transform="rotate(-0 159.52 470.36)">goal = path + offsets</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="367.52" y="130.64" transform="rotate(-0 367.52 130.64)">Tablet error</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="367.52" y="148.2" transform="rotate(-0 367.52 148.2)">lab only, in mm</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="367.52" y="210.08" transform="rotate(-0 367.52 210.08)">Label y</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="367.52" y="227.64" transform="rotate(-0 367.52 227.64)">the joint offset that</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="367.52" y="245.56" transform="rotate(-0 367.52 245.56)">would have cancelled</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="367.52" y="263.48" transform="rotate(-0 367.52 263.48)">that error</text><text style="font-size: 16px; text-anchor: middle; fill: #f4f1e8" x="367.52" y="325.36" transform="rotate(-0 367.52 325.36)">RLS update</text><text style="font-size: 14px; text-anchor: middle; fill: #c3c9bd" x="367.52" y="342.92" transform="rotate(-0 367.52 342.92)">changes W a little</text><text style="font-size: 15px; text-anchor: start; fill: #ff9f88" x="287.52" y="391.82" transform="rotate(-0 287.52 391.82)">The online head does this</text><text style="font-size: 15px; text-anchor: start; fill: #ff9f88" x="287.52" y="411.02" transform="rotate(-0 287.52 411.02)">while the arm draws.</text><text style="font-size: 15px; text-anchor: start; fill: #f4f1e8" x="287.52" y="442.22" transform="rotate(-0 287.52 442.22)">The frozen head stops this</text><text style="font-size: 15px; text-anchor: start; fill: #f4f1e8" x="287.52" y="461.42" transform="rotate(-0 287.52 461.42)">step. It needs only the path.</text><defs><clipPath id="head-schematic-pcee40f9d3c"><rect x="11.52" y="11.52" width="437.76" height="481.04"/></clipPath></defs></svg>
