edbc)" style="fill: none; stroke: #ff9f88; stroke-width: 2.2; stroke-linejoin: miter"/><text style="font-size: 19px; text-anchor: middle; fill: #93d4ff" x="84.15" y="42.52" transform="rotate(-0 84.15 42.52)">Measured</text><text style="font-size: 14px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="61.52" transform="rotate(-0 84.15 61.52)">real arm</text><text style="font-size: 19px; text-anchor: middle; fill: #a8e2a0" x="230.4" y="42.52" transform="rotate(-0 230.4 42.52)">Offline</text><text style="font-size: 14px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="61.52" transform="rotate(-0 230.4 61.52)">recorded data</text><text style="font-size: 19px; text-anchor: middle; fill: #ff9f88" x="376.65" y="42.52" transform="rotate(-0 376.65 42.52)">Simulation</text><text style="font-size: 14px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="61.52" transform="rotate(-0 376.65 61.52)">software arm</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="106.75" transform="rotate(-0 84.15 106.75)">The arm draws a</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="124.03" transform="rotate(-0 84.15 124.03)">test drawing.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="106.75" transform="rotate(-0 230.4 106.75)">Logs of real runs,</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="124.03" transform="rotate(-0 230.4 124.03)">split by whole motion.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="106.75" transform="rotate(-0 376.65 106.75)">A model of the arm,</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="124.03" transform="rotate(-0 376.65 124.03)">fitted on real logs.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="185.95" transform="rotate(-0 84.15 185.95)">The tablet and the</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="203.23" transform="rotate(-0 84.15 203.23)">encoders log the run.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="185.95" transform="rotate(-0 230.4 185.95)">Fit a model on some</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="203.23" transform="rotate(-0 230.4 203.23)">motions. Test on others.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="177.31" transform="rotate(-0 376.65 177.31)">The model plays the</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="194.59" transform="rotate(-0 376.65 194.59)">arm. The controller</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="211.87" transform="rotate(-0 376.65 211.87)">draws on it.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="265.15" transform="rotate(-0 84.15 265.15)">Pen minus reference</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="282.43" transform="rotate(-0 84.15 282.43)">at the same moment,</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="299.71" transform="rotate(-0 84.15 299.71)">as RMS.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="273.79" transform="rotate(-0 230.4 273.79)">Predict the pen error</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="291.07" transform="rotate(-0 230.4 291.07)">with a frozen scorer.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="273.79" transform="rotate(-0 376.65 273.79)">Score the drawing</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="291.07" transform="rotate(-0 376.65 291.07)">as for the real arm.</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="361.63" transform="rotate(-0 84.15 361.63)">2.74 mm, 1.057 mm</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="352.99" transform="rotate(-0 230.4 352.99)">2.22 mm, 1.008 mm,</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="370.27" transform="rotate(-0 230.4 370.27)">0.847 mm</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="352.99" transform="rotate(-0 376.65 352.99)">seqplan: at most 5 %</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="370.27" transform="rotate(-0 376.65 370.27)">better</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="84.15" y="432.19" transform="rotate(-0 84.15 432.19)">Ranks controllers</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="230.4" y="432.19" transform="rotate(-0 230.4 432.19)">Proposes candidates</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="423.55" transform="rotate(-0 376.65 423.55)">Never ranks learned</text><text style="font-size: 13.5px; text-anchor: middle; fill: #f4f1e8" x="376.65" y="440.83" transform="rotate(-0 376.65 440.83)">models</text><text style="font-size: 14.5px; text-anchor: middle; fill: #c3c9bd" x="230.4" y="491.09" transform="rotate(-0 230.4 491.09)">Every number in this part carries one of these three labels.</text><text style="font-size: 14.5px; text-anchor: middle; fill: #c3c9bd" x="230.4" y="509.65" transform="rotate(-0 230.4 509.65)">Only the left column ranks controllers.</text><defs><clipPath id="numbers-p7106cbedbc"><rect x="11.52" y="11.52" width="437.76" height="508.48"/></clipPath></defs></svg>
